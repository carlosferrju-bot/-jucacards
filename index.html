<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b45">
<title>JucaCards</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#12213a}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#loading .box{max-width:520px;padding:32px;border:1px solid #dce4f0;border-radius:18px;background:#fff;box-shadow:0 20px 50px #10204014}#loading b{font-size:24px}#loading p{color:#66758f;line-height:1.5}</style>
</head>
<body>
<div id="loading"><div class="box"><b>JucaCards</b><p>Carregando sua plataforma completa de estudos…</p></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./source.gz.b64',{cache:'no-store'});
    if(!r.ok) throw new Error('Não foi possível carregar a plataforma.');
    const b64=(await r.text()).trim();
    const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Este navegador não suporta a descompressão necessária.');
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([raw]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="box"><b>JucaCards</b><p>Não foi possível carregar a plataforma completa.</p><p style="font-size:13px">'+String(e.message||e)+'</p></div>';
  }
})();
</script>
</body>
</html>
