<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c18"><title>JucaCards</title>
<style>
:root{--bg:#080c18;--panel:#10172a;--panel2:#121a2e;--line:#202b45;--text:#edf3ff;--muted:#8e9ab5;--primary:#6d5dfc;--blue:#45a3ff;--green:#23c483;--red:#ff5c77;--yellow:#f4b740;--shadow:0 18px 50px #0006} :root.light{--bg:#f4f7fb;--panel:#fff;--panel2:#f7f9fd;--line:#dce3ef;--text:#172033;--muted:#647089;--shadow:0 12px 35px #1c294018}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{position:fixed;z-index:20;inset:0 auto 0 0;width:245px;padding:20px 14px;background:var(--panel);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;font-size:20px;font-weight:800}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--blue));display:grid;place-items:center;font-weight:900;color:#fff}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:left;display:flex;gap:11px;align-items:center;width:100%}.nav button:hover,.nav button.on{background:#171d33;color:#fff}.nav i{font-style:normal;width:22px;text-align:center}.bottom{position:absolute;left:14px;right:14px;bottom:18px}.main{margin-left:245px;padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.good{background:#123b2d;border-color:#1d7558;color:#fff}.btn.danger{background:#401b25;border-color:#743040;color:#fff}.btn.warn{background:#4a3814;border-color:#80601d;color:#fff}.theme-toggle{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;display:grid;place-items:center;font-size:20px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;margin-top:6px}.bar{height:8px;background:#202941;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:20px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.row .grow{flex:1;min-width:0}.tag{display:inline-flex;padding:5px 8px;border-radius:8px;background:#1b2440;color:#bfc9ff;font-size:12px;margin:2px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.toolbar .input{flex:1;min-width:200px}.empty{text-align:center;padding:45px;color:var(--muted)}.flash{min-height:270px;display:flex;flex-direction:column;justify-content:space-between}.flash .q{font-size:20px;line-height:1.5}.flash .a{font-size:16px;line-height:1.55;color:var(--muted)}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted)}textarea.input{min-height:150px;resize:vertical}.notice{padding:12px;border-radius:11px;background:#17213a;color:#cbd5ec}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:16px}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.studyq{text-align:center;padding:30px 10px}.studyq h2{font-size:28px;line-height:1.4}.answer{margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);line-height:1.6}.difficulty{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.hide{display:none!important}.danger-text{color:var(--red)}.small{font-size:12px}.htmlcontent{line-height:1.65;overflow-wrap:anywhere}.htmlcontent img{max-width:100%;height:auto}.htmlcontent table{max-width:100%;overflow:auto;display:block}.deckcolor{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#18213a;color:#cbd5ff;font-size:12px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto}.quick-search-backdrop{position:fixed;inset:0;background:#0009;display:none;place-items:start center;padding:7vh 16px;z-index:100}.quick-search-backdrop.show{display:grid}.quick-search{width:min(670px,100%);max-height:82vh;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #0008}.quick-search-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.quick-search-input-wrap{padding:16px 22px 12px}.quick-search-input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font-size:16px}.quick-search-results{max-height:56vh;overflow:auto;padding:4px 22px 20px}.quick-search-result{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px 14px;margin-top:8px}.quick-search-result:hover{border-color:var(--primary)}
@media(max-width:950px){.side{width:78px}.brand span,.nav button span{display:none}.nav button{justify-content:center}.main{margin-left:78px}.stats,.three,.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:620px){.side{position:sticky;width:100%;height:auto;padding:8px;display:flex;align-items:center;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0}.brand span{display:none}.logo{width:36px;height:36px}.nav{display:flex;overflow:auto;gap:5px;flex:1}.nav button{min-width:43px;width:43px;padding:10px;font-size:0}.nav i{font-size:16px}.bottom{display:none}.main{margin:0;padding:15px}.top{align-items:center}.title h1{font-size:23px}.stats,.three,.cards,.two{grid-template-columns:1fr}.stat strong{font-size:24px}.modalbox{padding:15px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">JC</div><span>JucaCards</span></div><nav class="nav" id="nav"></nav><div class="bottom"><button class="btn" style="width:100%" onclick="openImport()">↥ <span>Importar backup</span></button></div></aside><main class="main"><header class="top"><div class="title"><h1 id="heading">Dashboard</h1><div class="muted" id="sub">Seu centro de estudos</div></div><div class="actions"><button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Alternar tema">☾</button><button class="btn" onclick="openQuickSearch()">⌕ Buscar</button><button class="btn" onclick="backup()">Exportar</button><button class="btn primary" onclick="openCard()">+ Novo flashcard</button></div></header><section id="page"></section></main></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="quick-search-backdrop" id="quickSearch"><div class="quick-search"><div class="quick-search-head"><h2>Busca rápida</h2><button class="btn" onclick="closeQuickSearch()">×</button></div><div class="quick-search-input-wrap"><input class="quick-search-input" id="quickSearchInput" placeholder="Pesquisar flashcards, concursos ou disciplinas..." oninput="renderQuickSearch()" onkeydown="quickKey(event)"></div><div class="quick-search-results" id="quickSearchResults"></div></div></div><input id="import" type="file" accept="application/json" class="hide" onchange="importData(event)">
<script>
'use strict';
const KEY='jucacards_rebuild_v3';
const nav=[['dashboard','🏠','Dashboard'],['decks','📚','Concursos'],['cards','🗂️','Flashcards'],['study','🎯','Estudar'],['reviews','🔄','Revisões'],['stats','📊','Estatísticas'],['settings','⚙️','Configurações']];
const $=id=>document.getElementById(id); let D=loadData(); let state={page:'dashboard',filter:'',deck:'',discipline:'',studyId:null,showAnswer:false};
function uid(p='c'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function defaultData(){return {cards:[],decks:[{id:'d0',name:'Geral',desc:'Coleção padrão.',color:'#6d5dfc',disciplines:[]}],reviews:[],settings:{name:'Carlos',theme:'dark',initial:3,hard:1,good:4,easy:7,max:365}}}
function loadData(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));const old=localStorage.getItem('jucacards_rebuild_v2')||localStorage.getItem('jucacards_rebuild_v1');return old?normalize(JSON.parse(old)):defaultData()}catch(e){return defaultData()}}
function normalize(src){
 const x=src||{}, out=defaultData();
 const incomingDecks=Array.isArray(x.decks)?x.decks:[];
 if(incomingDecks.length){out.decks=incomingDecks.map((d,i)=>typeof d==='string'?{id:'d_'+i,name:d,desc:'',color:'#6d5dfc',disciplines:[]}:{id:String(d.id||uid('d')),name:String(d.name||'Sem nome'),desc:String(d.desc||''),color:d.color||'#6d5dfc',disciplines:Array.isArray(d.disciplines)?d.disciplines.map(String):[]})}
 const deckById=new Map(out.decks.map(d=>[d.id,d]));
 const cards=Array.isArray(x.cards)?x.cards:[];
 out.cards=cards.map(c=>{const legacyFront=c.front!==undefined||c.back!==undefined;let deckId=String(c.deck||'');if(!deckById.has(deckId)){const byName=out.decks.find(d=>d.name===deckId);if(byName)deckId=byName.id;else{const nd={id:deckId||uid('d'),name:deckId||'Geral',desc:'',color:'#6d5dfc',disciplines:[]};out.decks.push(nd);deckById.set(nd.id,nd);deckId=nd.id}}
  let next=c.next!==undefined?c.next:null;if(c.due!==undefined)next=c.due==null?null:new Date(Number(c.due)).toISOString();
  return {id:String(c.id||uid()),deck:deckId,discipline:String(c.discipline||''),q:String(legacyFront?c.front:(c.q||'')),a:String(legacyFront?c.back:(c.a||'')),tags:String(c.tags||''),source:String(c.source||''),type:String(c.type||'normal'),correct:c.correct??null,next,reps:Number(c.reps||0),interval:Number(c.interval||0),ease:Number(c.ease||2.5),seen:!!c.seen,lastAnswer:c.lastAnswer??null,lastAnswerCorrect:c.lastAnswerCorrect??null};
 });
 out.reviews=Array.isArray(x.reviews)?x.reviews.map(r=>({id:String(r.id||uid('r')),card:String(r.card||''),rating:Number(r.rating||0),at:Number(r.at||Date.now())})):[];
 out.settings={...out.settings,...(x.settings||{})};out.settings.theme=out.settings.theme==='light'?'light':'dark';return out;
}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function html(s=''){return String(s)}
function pct(a,b){return b?Math.round(a/b*100):0}
function isDue(c){return c.next==null||!c.next||new Date(c.next)<=new Date()}
function dueCount(){return D.cards.filter(isDue).length}
function deck(id){return D.decks.find(d=>d.id===id)||D.decks[0]}
function deckName(id){return deck(id)?.name||'Geral'}
function fmtMin(m){m=Math.max(0,Math.round(m));return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`}
function navRender(){$('nav').innerHTML=nav.map(n=>`<button class="${state.page===n[0]?'on':''}" onclick="view('${n[0]}')"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('')}
function view(p){state.page=p;state.showAnswer=false;navRender();const n=nav.find(x=>x[0]===p);$('heading').textContent=n?n[2]:'Dashboard';$('sub').textContent=p==='dashboard'?'Seu centro de estudos':p==='study'?'Sessão de estudo':'Gerencie seu estudo';render()}
function render(){const p=$('page');if(state.page==='dashboard')p.innerHTML=dashboard();else if(state.page==='decks')p.innerHTML=decks();else if(state.page==='cards')p.innerHTML=cards();else if(state.page==='study')p.innerHTML=study();else if(state.page==='reviews')p.innerHTML=reviews();else if(state.page==='stats')p.innerHTML=stats();else p.innerHTML=settings();applyTheme()}
function dashboard(){const total=D.cards.length, d=dueCount(), seen=D.cards.filter(c=>c.reps>0).length;const deckRows=D.decks.map(x=>{const n=D.cards.filter(c=>c.deck===x.id).length;return `<div class="row"><div class="grow"><b><span class="deckcolor" style="background:${x.color}"></span>${esc(x.name)}</b><div class="muted">${n} flashcard(s)</div></div><button class="btn" onclick="state.deck='${x.id}';view('cards')">Abrir</button></div>`}).join('');return `<div class="grid stats"><div class="card stat"><div class="muted">Flashcards</div><strong>${total}</strong><small class="muted">${seen} já revisados</small></div><div class="card stat"><div class="muted">Para revisar</div><strong>${d}</strong><small class="muted">pendentes agora</small></div><div class="card stat"><div class="muted">Concursos</div><strong>${D.decks.length}</strong><small class="muted">coleções</small></div><div class="card stat"><div class="muted">Progresso</div><strong>${pct(seen,total)}%</strong><div class="bar" style="margin-top:8px"><span style="width:${pct(seen,total)}%"></span></div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Continue estudando</h3><div class="row"><div class="grow"><b>${d?'Revisões pendentes':'Todos os flashcards'}</b><div class="muted">${d?d+' cartão(ões) aguardando revisão':'Sua biblioteca está pronta para estudo'}</div></div><button class="btn primary" onclick="view('${d?'reviews':'study'}')">Começar</button></div></div><div class="card"><h3>Concursos</h3><div class="list">${deckRows||'<div class="empty">Nenhum concurso cadastrado.</div>'}</div></div></div>`}
function decks(){return `<div class="toolbar"><button class="btn primary" onclick="openDeck()">+ Novo concurso</button></div><div class="grid cards">${D.decks.map(d=>`<div class="card"><div class="split"><h3><span class="deckcolor" style="background:${d.color}"></span>${esc(d.name)}</h3><button class="btn" onclick="openDeck('${d.id}')">Editar</button></div><div class="muted">${esc(d.desc)}</div><p><span class="pill">${D.cards.filter(c=>c.deck===d.id).length} cards</span> <span class="pill">${d.disciplines.length} disciplinas</span></p><div>${d.disciplines.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="muted">Sem disciplinas cadastradas</span>'}</div></div>`).join('')}</div>`}
function cards(){let arr=D.cards.filter(c=>!state.deck||c.deck===state.deck);if(state.filter){const q=state.filter.toLowerCase();arr=arr.filter(c=>(c.q+c.a+c.tags+c.discipline+deckName(c.deck)).toLowerCase().includes(q))}if(state.discipline)arr=arr.filter(c=>c.discipline===state.discipline);return `<div class="toolbar"><input class="input" placeholder="Pesquisar flashcards..." value="${esc(state.filter)}" oninput="state.filter=this.value;render()"><select class="input" style="max-width:250px" onchange="state.deck=this.value;render()"><option value="">Todos os concursos</option>${D.decks.map(d=>`<option value="${d.id}" ${state.deck===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><button class="btn" onclick="state.deck='';state.discipline='';state.filter='';render()">Limpar</button></div><div class="muted" style="margin-bottom:12px">${arr.length} flashcard(s)</div><div class="grid cards">${arr.map(c=>`<div class="card flash"><div><div class="small muted">${esc(deckName(c.deck))} · ${esc(c.discipline||'Sem disciplina')}</div><div class="q htmlcontent" style="margin-top:12px">${html(c.q)}</div></div><div><div class="muted small">${esc(c.tags)}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="openCard('${c.id}')">Editar</button><button class="btn primary" onclick="startCard('${c.id}')">Estudar</button><button class="btn danger" onclick="removeCard('${c.id}')">Excluir</button></div></div></div>`).join('')||'<div class="card empty">Nenhum flashcard encontrado.</div>'}</div>`}
function study(){let c=state.studyId?D.cards.find(x=>x.id===state.studyId):D.cards.find(isDue)||D.cards[0];if(!c)return '<div class="card empty">Você ainda não possui flashcards. Crie ou importe um backup.</div>';state.studyId=c.id;return `<div class="card"><div class="split"><div><span class="pill">${esc(deckName(c.deck))}</span> <span class="pill">${esc(c.discipline||'Sem disciplina')}</span></div><button class="btn" onclick="state.studyId=null;render()">Próximo</button></div><div class="studyq"><div class="small muted">${c.reps?`Repetições: ${c.reps}`:'Novo card'}</div><h2 class="htmlcontent">${html(c.q)}</h2>${state.showAnswer?`<div class="answer htmlcontent">${html(c.a)}</div><div class="difficulty"><button class="btn danger" onclick="rate('${c.id}',0)">Errei</button><button class="btn warn" onclick="rate('${c.id}',1)">Difícil</button><button class="btn good" onclick="rate('${c.id}',2)">Bom</button><button class="btn primary" onclick="rate('${c.id}',3)">Fácil</button></div>`:`<button class="btn primary" onclick="state.showAnswer=true;render()">Mostrar resposta</button>`}</div></div>`}
function reviews(){const arr=D.cards.filter(isDue);return `<div class="card"><div class="split"><div><h3>Revisões pendentes</h3><div class="muted">${arr.length} card(s) vencido(s) ou ainda sem revisão.</div></div><button class="btn primary" onclick="view('study')">Estudar</button></div></div><div class="grid cards" style="margin-top:16px">${arr.map(c=>`<div class="card"><div class="small muted">${esc(deckName(c.deck))} · ${esc(c.discipline)}</div><div class="htmlcontent" style="margin:10px 0">${html(c.q)}</div><button class="btn primary" onclick="startCard('${c.id}')">Revisar</button></div>`).join('')||'<div class="card empty">Nada pendente. Excelente!</div>'}</div>`}
function stats(){const total=D.cards.length,by={};D.cards.forEach(c=>by[c.discipline||'Sem disciplina']=(by[c.discipline||'Sem disciplina']||0)+1);return `<div class="grid stats"><div class="card stat"><div class="muted">Total</div><strong>${total}</strong></div><div class="card stat"><div class="muted">Revisados</div><strong>${D.cards.filter(c=>c.reps>0).length}</strong></div><div class="card stat"><div class="muted">Pendentes</div><strong>${dueCount()}</strong></div><div class="card stat"><div class="muted">Revisões registradas</div><strong>${D.reviews.length}</strong></div></div><div class="card" style="margin-top:16px"><h3>Cards por disciplina</h3><div class="list">${Object.entries(by).map(([k,v])=>`<div class="row"><div class="grow"><b>${esc(k)}</b><div class="bar" style="margin-top:8px"><span style="width:${pct(v,total)}%"></span></div></div><strong>${v}</strong></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div></div>`}
function settings(){return `<div class="grid two"><div class="card"><h3>Configurações</h3><div class="form"><label>Nome<input class="input" id="setName" value="${esc(D.settings.name||'Carlos')}"></label><label class="check"><input type="checkbox" id="setLight" ${D.settings.theme==='light'?'checked':''}> Usar tema claro</label><button class="btn primary" onclick="saveSettings()">Salvar</button></div></div><div class="card"><h3>Compatibilidade de backup</h3><div class="notice">O importador aceita o formato antigo do JucaCards com <b>decks</b>, <b>cards</b>, <b>reviews</b> e <b>settings</b>, inclusive campos <b>front/back</b>, <b>due</b>, <b>interval</b>, <b>reps</b>, <b>ease</b>, <b>type</b> e <b>correct</b>.</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openImport()">Importar JSON</button><button class="btn" onclick="backup()">Exportar compatível</button></div></div></div>`}
function openModal(body){$('modalbox').innerHTML=body;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openDeck(id){const d=id?deck(id):{id:'',name:'',desc:'',color:'#6d5dfc',disciplines:[]};openModal(`<h2>${id?'Editar':'Novo'} concurso</h2><div class="form"><label>Nome<input class="input" id="dn" value="${esc(d.name)}"></label><label>Descrição<input class="input" id="dd" value="${esc(d.desc)}"></label><label>Cor<input class="input" id="dc" type="color" value="${d.color||'#6d5dfc'}"></label><label>Disciplinas <span class="small">uma por linha</span><textarea class="input" id="di">${esc(d.disciplines.join('\n'))}</textarea></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveDeck('${id||''}')">Salvar</button></div></div>`)}
function saveDeck(id){const name=$('dn').value.trim();if(!name)return alert('Informe o nome do concurso.');const disciplines=$('di').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(id){const d=deck(id);Object.assign(d,{name,desc:$('dd').value.trim(),color:$('dc').value,disciplines})}else D.decks.push({id:uid('d'),name,desc:$('dd').value.trim(),color:$('dc').value,disciplines});save();closeModal();render()}
function openCard(id){const c=id?D.cards.find(x=>x.id===id):null;const d=c||{deck:state.deck||D.decks[0]?.id||'',discipline:'',q:'',a:'',tags:'',source:'',type:'normal',correct:null};openModal(`<h2>${id?'Editar':'Novo'} flashcard</h2><div class="form"><label>Concurso<select class="input" id="cd">${D.decks.map(x=>`<option value="${x.id}" ${d.deck===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Disciplina<input class="input" id="cp" value="${esc(d.discipline||'')}"></label><label>Frente / questão<textarea class="input" id="cq">${esc(d.q||'')}</textarea></label><label>Verso / resposta<textarea class="input" id="ca">${esc(d.a||'')}</textarea></label><label>Tags<input class="input" id="ct" value="${esc(d.tags||'')}"></label><label>Fonte<input class="input" id="cs" value="${esc(d.source||'')}"></label><label>Tipo<select class="input" id="cy"><option value="normal" ${d.type==='normal'?'selected':''}>Normal</option><option value="tf" ${d.type==='tf'?'selected':''}>Certo/Errado</option></select></label><label>Gabarito<input class="input" id="cc" value="${esc(d.correct||'')}"></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCard('${id||''}')">Salvar</button></div></div>`)}
function saveCard(id){const obj={deck:$('cd').value,discipline:$('cp').value.trim(),q:$('cq').value,a:$('ca').value,tags:$('ct').value.trim(),source:$('cs').value.trim(),type:$('cy').value,correct:$('cc').value.trim()||null};if(id){const c=D.cards.find(x=>x.id===id);Object.assign(c,obj)}else D.cards.push({...obj,id:uid(),next:null,reps:0,interval:0,ease:2.5,seen:false,lastAnswer:null,lastAnswerCorrect:null});save();closeModal();render()}
function removeCard(id){if(confirm('Excluir este flashcard?')){D.cards=D.cards.filter(c=>c.id!==id);D.reviews=D.reviews.filter(r=>r.card!==id);save();render()}}
function startCard(id){state.studyId=id;state.showAnswer=false;view('study')}
function rate(id,rating){const c=D.cards.find(x=>x.id===id);if(!c)return;const now=Date.now();const days=rating===0?0:rating===1?Math.max(1,Number(c.interval||1)*0.5):rating===2?Math.max(1,Number(c.interval||0)+Number(D.settings.good||4)):Math.max(1,Number(c.interval||0)*1.8+Number(D.settings.easy||7));c.reps=Number(c.reps||0)+1;c.interval=Math.min(Number(D.settings.max||365),days);c.ease=Math.max(1.3,Number(c.ease||2.5)+(rating===3?.15:rating===1?-.15:0));c.next=rating===0?null:new Date(now+days*86400000).toISOString();c.seen=true;c.lastAnswer=['Errei','Difícil','Bom','Fácil'][rating];c.lastAnswerCorrect=rating>0;D.reviews.push({id:uid('r'),card:id,rating,at:now});save();state.showAnswer=false;const next=D.cards.find(x=>x.id!==id&&isDue(x));state.studyId=next?.id||null;render()}
function backup(){const payload={decks:D.decks,cards:D.cards.map(c=>({...c,front:c.q,back:c.a,due:c.next?new Date(c.next).getTime():null})),reviews:D.reviews,settings:{initial:Number(D.settings.initial||3),hard:Number(D.settings.hard||1),good:Number(D.settings.good||4),easy:Number(D.settings.easy||7),max:Number(D.settings.max||365)}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jucacards-backup.json';a.click();URL.revokeObjectURL(a.href)}
function openImport(){$('import').value='';$('import').click()}
function importData(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!incoming||!Array.isArray(incoming.cards))throw new Error('Formato inválido');const imported=normalize(incoming);const replace=confirm(`Backup encontrado: ${imported.cards.length} flashcards e ${imported.decks.length} concursos.\n\nOK = substituir os dados atuais\nCancelar = mesclar com os dados atuais`);D=replace?imported:mergeData(D,imported);save();state={page:'dashboard',filter:'',deck:'',discipline:'',studyId:null,showAnswer:false};navRender();render();alert('Importação concluída com compatibilidade com o formato antigo.')}catch(e){alert('Não foi possível importar o arquivo: '+e.message)}};r.readAsText(f)}
function mergeData(base,inc){const out=normalize(base), deckMap=new Map(out.decks.map(d=>[d.name,d.id]));inc.decks.forEach(d=>{if(!deckMap.has(d.name)){const nd={...d,id:uid('d')};out.decks.push(nd);deckMap.set(nd.name,nd.id)}});const ids=new Set(out.cards.map(c=>c.id));inc.cards.forEach(c=>{const n={...c,id:ids.has(c.id)?uid():c.id,deck:deckMap.get(deckNameFromInc(inc,c.deck))||out.decks[0].id};out.cards.push(n)});out.reviews.push(...inc.reviews.map(r=>({...r,id:uid('r')})));return out}
function deckNameFromInc(inc,id){return inc.decks.find(d=>d.id===id)?.name||String(id||'Geral')}
function saveSettings(){D.settings.name=$('setName').value.trim()||'Carlos';D.settings.theme=$('setLight').checked?'light':'dark';save();applyTheme();alert('Configurações salvas.')}
function toggleTheme(){D.settings.theme=D.settings.theme==='light'?'dark':'light';save();applyTheme()}
function applyTheme(){document.documentElement.classList.toggle('light',D.settings.theme==='light');$('themeBtn').textContent=D.settings.theme==='light'?'☀':'☾'}
function openQuickSearch(){$('quickSearch').classList.add('show');$('quickSearchInput').value='';renderQuickSearch();setTimeout(()=>$('quickSearchInput').focus(),20)}
function closeQuickSearch(){$('quickSearch').classList.remove('show')}
function renderQuickSearch(){const q=$('quickSearchInput').value.trim().toLowerCase();if(!q){$('quickSearchResults').innerHTML='<div class="empty">Digite para pesquisar.</div>';return}const results=[];D.cards.forEach(c=>{if((c.q+c.a+c.tags+c.discipline+deckName(c.deck)).toLowerCase().includes(q))results.push(`<button class="quick-search-result" onclick="closeQuickSearch();startCard('${c.id}')"><b>${esc(strip(c.q).slice(0,100))}</b><div class="small muted">${esc(deckName(c.deck))} · ${esc(c.discipline)}</div></button>`)});D.decks.forEach(d=>{if((d.name+d.desc+d.disciplines.join(' ')).toLowerCase().includes(q))results.push(`<button class="quick-search-result" onclick="closeQuickSearch();state.deck='${d.id}';view('cards')"><b>${esc(d.name)}</b><div class="small muted">Concurso · ${d.disciplines.length} disciplinas</div></button>`)});$('quickSearchResults').innerHTML=results.join('')||'<div class="empty">Nenhum resultado.</div>'}
function strip(s){const x=document.createElement('div');x.innerHTML=s||'';return x.textContent||x.innerText||''}
function quickKey(e){if(e.key==='Escape')closeQuickSearch()}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openQuickSearch()}if(e.key==='Escape')closeQuickSearch()});
navRender();render();

init();
</script>
</body></html>
