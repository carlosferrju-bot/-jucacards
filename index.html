<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c18"><title>JucaCards</title><style>:root{--bg:#080c18;--panel:#0e1425;--panel2:#121a2e;--line:#202b45;--text:#edf3ff;--muted:#8e9ab5;--p:#6d5dfc;--p2:#8b7dff;--g:#23c483;--y:#f4b740;--r:#ff5c77;--b:#45a3ff;--shadow:0 18px 50px #0006}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#151b3a 0,#080c18 42%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:#0a0f1d;border-right:1px solid var(--line);padding:20px 14px;z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;font-weight:800;font-size:20px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--p),#45a3ff);display:grid;place-items:center;font-weight:900}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:left;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.on{background:#171d33;color:#fff}.nav i{font-style:normal;width:22px;text-align:center}.bottom{position:absolute;bottom:18px;left:14px;right:14px}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#121a2e;color:#fff;padding:10px 14px;border-radius:10px}.btn.primary{background:var(--p);border-color:var(--p)}.btn.good{background:#123b2d;border-color:#1d7558}.btn.danger{background:#401b25;border-color:#743040}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(180deg,#10172a,#0d1424);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;margin-top:6px}.bar{height:8px;background:#202941;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--b));border-radius:20px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1221}.tag{display:inline-flex;padding:5px 8px;border-radius:8px;background:#1b2440;color:#bfc9ff;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.input{width:100%;background:#0a1020;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px}.toolbar .input{flex:1;min-width:180px}.empty{text-align:center;padding:35px;color:var(--muted)}.cards{grid-template-columns:repeat(3,1fr)}.flash{min-height:260px;display:flex;flex-direction:column;justify-content:space-between}.flash .q{font-size:20px;line-height:1.5}.flash .a{font-size:17px;line-height:1.5;color:#cbd5ec}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:30;padding:16px}.modal.show{display:grid}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#0e1425;border:1px solid var(--line);border-radius:18px;padding:20px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted)}.form textarea{min-height:130px;resize:vertical}.form .tw{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timer{font-size:48px;font-variant-numeric:tabular-nums;text-align:center;padding:24px}.notice{padding:12px;border-radius:11px;background:#17213a;color:#cbd5ec}.hide{display:none!important}@media(max-width:950px){.side{width:78px}.brand span,.nav button span,.bottom span{display:none}.nav button{justify-content:center}.main{margin-left:78px;width:calc(100% - 78px)}.stats,.three,.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:620px){.app{display:block}.side{position:sticky;width:100%;height:auto;padding:8px;display:flex;align-items:center;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0}.brand span{display:none}.logo{width:36px;height:36px}.nav{display:flex;overflow:auto;gap:5px;flex:1}.nav button{min-width:43px;padding:10px;font-size:0}.nav i{font-size:16px}.bottom{display:none}.main{margin:0;width:auto;padding:15px}.top{display:block}.actions{margin-top:12px}.stats,.three,.cards,.two{grid-template-columns:1fr}.stat strong{font-size:24px}.form .tw{grid-template-columns:1fr}.timer{font-size:40px}.modalbox{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">JC</div><span>JucaCards</span></div><nav class="nav" id="nav"></nav><div class="bottom"><button class="nav button" onclick="view('settings')">⚙️ <span>Configurações</span></button></div></aside><main class="main"><header class="top"><div class="title"><h1 id="heading">Dashboard</h1><div class="muted" id="sub">Seu centro de estudos</div></div><div class="actions"><button class="btn" onclick="backup()">Exportar</button><button class="btn primary" onclick="openCard()">+ Novo flashcard</button></div></header><section id="page"></section></main></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><input id="import" type="file" accept="application/json" class="hide" onchange="importData(event)"><script>
const KEY='jucacards_rebuild_v1';let D=JSON.parse(localStorage.getItem(KEY)||'null')||{cards:[],decks:['Geral'],sessions:[],reviews:[],settings:{name:'Carlos',theme:'dark'}};let state={page:'dashboard',filter:'',study:null,timer:0,interval:null};
const nav=[['dashboard','🏠','Dashboard'],['decks','📚','Concursos'],['cards','🗂️','Flashcards'],['study','🎯','Estudar'],['reviews','🔄','Revisões'],['stats','📊','Estatísticas'],['settings','⚙️','Configurações']];
function save(){localStorage.setItem(KEY,JSON.stringify(D))}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function pct(a,b){return b?Math.round(a/b*100):0}function navRender(){navEl.innerHTML=nav.map(x=>`<button class="${state.page==x[0]?'on':''}" onclick="view('${x[0]}')"><i>${x[1]}</i><span>${x[2]}</span></button>`).join('')}const navEl=document.getElementById('nav');
function view(p){state.page=p;navRender();let n=nav.find(x=>x[0]==p);heading.textContent=n?n[2]:'Configurações';sub.textContent=p==='dashboard'?'Seu centro de estudos':'Gerencie seu estudo';render()}
function render(){const p=document.getElementById('page');if(state.page==='dashboard')p.innerHTML=dashboard();if(state.page==='decks')p.innerHTML=decks();if(state.page==='cards')p.innerHTML=cards();if(state.page==='study')p.innerHTML=study();if(state.page==='reviews')p.innerHTML=reviews();if(state.page==='stats')p.innerHTML=stats();if(state.page==='settings')p.innerHTML=settings()}
function dashboard(){let due=D.cards.filter(c=>new Date(c.next||0)<=new Date()).length,h=D.sessions.reduce((a,s)=>a+s.min,0),done=D.cards.filter(c=>c.seen).length;return `<div class="grid stats"><div class="card stat"><div class="muted">Flashcards</div><strong>${D.cards.length}</strong><small class="muted">${done} estudados</small></div><div class="card stat"><div class="muted">Para revisar</div><strong>${due}</strong><small class="muted">pendentes hoje</small></div><div class="card stat"><div class="muted">Concursos</div><strong>${D.decks.length}</strong><small class="muted">coleções</small></div><div class="card stat"><div class="muted">Tempo estudado</div><strong>${Math.floor(h/60)}h ${h%60}m</strong><small class="muted">total registrado</small></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Continue estudando</h3><div class="list"><div class="row"><div><b>${due?'Revisões pendentes':'Flashcards'}</b><div class="muted">${due?due+' cartões aguardando revisão':'Escolha uma coleção para começar'}</div></div><button class="btn primary" onclick="view('${due?'reviews':'study'}')">Começar</button></div><div class="row"><div><b>Seu progresso</b><div class="bar" style="margin-top:9px"><span style="width:${pct(done,D.cards.length)}%"></span></div></div><b>${pct(done,D.cards.length)}%</b></div></div></div><div class="card"><h3>Atalhos</h3><div class="actions"><button class="btn" onclick="openCard()">Novo flashcard</button><button class="btn" onclick="openDeck()">Novo concurso</button><button class="btn" onclick="document.getElementById('import').click()">Importar backup</button></div></div></div>`}
function decks(){return `<div class="toolbar"><input class="input" placeholder="Buscar concurso..." oninput="state.filter=this.value;render()"><button class="btn primary" onclick="openDeck()">+ Concurso</button></div><div class="grid cards">${D.decks.filter(x=>x.toLowerCase().includes(state.filter.toLowerCase())).map((d,i)=>{let c=D.cards.filter(x=>x.deck===d).length;return `<div class="card"><span class="tag">CONCURSO</span><h3>${esc(d)}</h3><p class="muted">${c} flashcards</p><div class="actions"><button class="btn" onclick="viewDeck('${esc(d)}')">Abrir</button><button class="btn danger" onclick="delDeck(${i})">Excluir</button></div></div>`}).join('')}</div>`}
function viewDeck(d){state.filter=d;state.page='cards';heading.textContent=d;navRender();render()}
function cards(){let list=D.cards.filter(c=>{let q=state.filter.toLowerCase();return !q||c.q.toLowerCase().includes(q)||c.a.toLowerCase().includes(q)||c.deck.toLowerCase().includes(q)});return `<div class="toolbar"><input class="input" value="${esc(state.filter)}" placeholder="Buscar flashcards..." oninput="state.filter=this.value;render()"><button class="btn" onclick="state.filter='';render()">Limpar</button><button class="btn primary" onclick="openCard()">+ Novo</button></div><div class="grid cards">${list.map(c=>`<article class="card flash"><div><span class="tag">${esc(c.deck)}</span><h3 class="q">${esc(c.q)}</h3><p class="a">${esc(c.a)}</p></div><div class="actions"><button class="btn" onclick="editCard('${c.id}')">Editar</button><button class="btn danger" onclick="delCard('${c.id}')">Excluir</button></div></article>`).join('')||'<div class="card empty">Nenhum flashcard encontrado.</div>'}</div>`}
function study(){if(!state.study){let c=D.cards.find(x=>!x.seen)||D.cards[0];if(c)state.study={id:c.id,show:false}}let c=state.study&&D.cards.find(x=>x.id===state.study.id);if(!c)return '<div class="card empty">Crie alguns flashcards para iniciar o estudo.</div>';return `<div class="card"><span class="tag">${esc(c.deck)}</span><div style="padding:45px 10px;text-align:center"><div class="muted">Pergunta</div><h2>${esc(c.q)}</h2>${state.study.show?`<div class="notice"><b>Resposta</b><p>${esc(c.a)}</p></div>`:'<p class="muted">Tente responder mentalmente antes de revelar.</p>'}</div><div class="actions" style="justify-content:center"><button class="btn" onclick="state.study.show=true;render()">${state.study.show?'Resposta revelada':'Revelar resposta'}</button>${state.study.show?`<button class="btn danger" onclick="rate(1)">Difícil</button><button class="btn" onclick="rate(2)">Bom</button><button class="btn good" onclick="rate(3)">Fácil</button>`:''}</div></div>`}
function rate(r){let c=D.cards.find(x=>x.id===state.study.id);if(!c)return;c.seen=true;c.reps=(c.reps||0)+1;let days=r===1?1:r===2?3:7;c.next=new Date(Date.now()+days*86400000).toISOString();D.reviews.push({id:c.id,r,date:new Date().toISOString()});save();let n=D.cards.find(x=>x.id!==c.id&&!x.seen)||D.cards.find(x=>x.id!==c.id);state.study=n?{id:n.id,show:false}:null;render()}
function reviews(){let due=D.cards.filter(c=>new Date(c.next||0)<=new Date());return `<div class="card"><h3>Revisões de hoje</h3><p class="muted">${due.length} cartão(ões) aguardando revisão.</p><div class="list">${due.map(c=>`<div class="row"><div><b>${esc(c.q)}</b><div class="muted">${esc(c.deck)}</div></div><button class="btn primary" onclick="state.study={id:'${c.id}',show:false};view('study')">Revisar</button></div>`).join('')||'<div class="empty">Você está em dia. 🎉</div>'}</div></div>`}
function stats(){let total=D.cards.length,seen=D.cards.filter(c=>c.seen).length,h=D.sessions.reduce((a,s)=>a+s.min,0),r=D.reviews.length;return `<div class="grid stats"><div class="card stat"><div class="muted">Progresso</div><strong>${pct(seen,total)}%</strong><div class="bar"><span style="width:${pct(seen,total)}%"></span></div></div><div class="card stat"><div class="muted">Revisões</div><strong>${r}</strong></div><div class="card stat"><div class="muted">Sessões</div><strong>${D.sessions.length}</strong></div><div class="card stat"><div class="muted">Horas</div><strong>${(h/60).toFixed(1)}</strong></div></div><div class="card" style="margin-top:16px"><h3>Desempenho por concurso</h3><div class="list">${D.decks.map(d=>{let n=D.cards.filter(c=>c.deck===d).length,s=D.cards.filter(c=>c.deck===d&&c.seen).length;return `<div><div class="row"><span>${esc(d)}</span><b>${pct(s,n)}%</b></div><div class="bar"><span style="width:${pct(s,n)}%"></span></div></div>`}).join('')}</div></div>`}
function settings(){return `<div class="grid two"><div class="card"><h3>Preferências</h3><div class="form"><label>Nome<input class="input" id="name" value="${esc(D.settings.name)}"></label><button class="btn primary" onclick="D.settings.name=document.getElementById('name').value;save();alert('Salvo!')">Salvar</button></div></div><div class="card"><h3>Dados</h3><p class="muted">Seus dados ficam salvos neste navegador. Use exportar para levar tudo para outro dispositivo.</p><div class="actions"><button class="btn" onclick="backup()">Exportar backup</button><button class="btn" onclick="document.getElementById('import').click()">Importar backup</button><button class="btn danger" onclick="resetAll()">Apagar dados</button></div></div></div>`}
function openCard(id){let c=id&&D.cards.find(x=>x.id===id);modalbox.innerHTML=`<h2>${c?'Editar':'Novo'} flashcard</h2><div class="form"><label>Pergunta<textarea class="input" id="fq">${esc(c?.q||'')}</textarea></label><label>Resposta<textarea class="input" id="fa">${esc(c?.a||'')}</textarea></label><label>Concurso<select class="input" id="fd">${D.decks.map(d=>`<option ${d===c?.deck?'selected':''}>${esc(d)}</option>`).join('')}</select></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCard('${id||''}')">Salvar</button></div></div>`;modal.classList.add('show')}
function saveCard(id){let q=fq.value.trim(),a=fa.value.trim(),deck=fd.value;if(!q||!a)return alert('Preencha pergunta e resposta.');if(id){let c=D.cards.find(x=>x.id===id);Object.assign(c,{q,a,deck})}else D.cards.push({id:crypto.randomUUID(),q,a,deck,seen:false,reps:0,next:new Date().toISOString()});save();closeModal();state.filter='';render()}
function editCard(id){openCard(id)}function delCard(id){if(confirm('Excluir este flashcard?')){D.cards=D.cards.filter(c=>c.id!==id);save();render()}}
function openDeck(){modalbox.innerHTML=`<h2>Novo concurso</h2><div class="form"><label>Nome<input class="input" id="dn" placeholder="Ex.: CFO PMBA"></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveDeck()">Criar</button></div></div>`;modal.classList.add('show')}
function saveDeck(){let n=dn.value.trim();if(!n)return;if(!D.decks.includes(n))D.decks.push(n);save();closeModal();render()}function delDeck(i){let d=D.decks[i];if(D.cards.some(c=>c.deck===d))return alert('Remova ou mova os flashcards deste concurso primeiro.');if(confirm('Excluir concurso?')){D.decks.splice(i,1);save();render()}}
function closeModal(){modal.classList.remove('show')}function backup(){let blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jucacards-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.cards||!x.decks)throw 0;D=x;save();view('dashboard');alert('Backup importado com sucesso!')}catch{alert('Backup inválido.')}};r.readAsText(f)}function resetAll(){if(confirm('Apagar todos os dados?')){localStorage.removeItem(KEY);location.reload()}}
function init(){navRender();render()}init();
</script></body></html>
