<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080c18">
<title>JucaCards</title>
<style>
html,body{margin:0;min-height:100%;background:#080c18;color:#edf3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center}
#loading .box{padding:28px;border:1px solid #202b45;border-radius:18px;background:#0e1425}
#app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#080c18}
</style>
</head>
<body>
<div id="loading"><div class="box">Carregando JucaCards…</div></div>
<script>
(async()=>{
 try{
  const r=await fetch('https://raw.githubusercontent.com/carlosferrju-bot/-jucacards/main/source.gz.b64?v=4',{cache:'no-store'});
  if(!r.ok)throw new Error('Não foi possível carregar a fonte original.');
  const b64=(await r.text()).replace(/\s+/g,'');
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let html;
  if('DecompressionStream' in window){
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   html=await new Response(stream).text();
  }else{
   throw new Error('Este navegador não suporta a descompressão necessária.');
  }
  if(!/<html[\s>]/i.test(html)||!/<script[\s>]/i.test(html))throw new Error('Fonte original inválida.');
  const responsive=`<style id="jucacards-responsive">
   @media(max-width:1100px){.flash-wrap{grid-template-columns:200px minmax(0,1fr)}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
   @media(max-width:800px){.sidebar{width:82px;padding:14px 9px}.brand{justify-content:center}.brand>div:last-child,.sidebar-bottom{display:none}.nav button{justify-content:center;font-size:0}.nav button .icon{font-size:18px}.main{margin-left:82px;width:calc(100% - 82px);padding:18px}.two,.three,.cards-grid,.flash-wrap{grid-template-columns:1fr}}
   @media(max-width:600px){.sidebar{position:sticky!important;top:0!important;width:100%!important;height:auto!important;padding:8px 10px!important;display:flex!important;align-items:center;overflow:hidden;border-right:0!important;border-bottom:1px solid var(--line)}.brand{padding:0;flex:0 0 auto}.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}.nav button{flex:0 0 auto;width:auto;min-width:42px;padding:10px}.main{margin:0;width:auto;padding:14px 12px 28px}.topbar{display:block}.stats{grid-template-columns:1fr 1fr;gap:10px}.form-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-box{max-height:96vh}.search{width:100%;box-sizing:border-box}.flashcard,.flash-inner{min-height:58vh}}
  </style>`;
  html=html.replace(/<\/head>/i,responsive+'</head>');
  const frame=document.createElement('iframe');
  frame.id='app-frame';frame.title='JucaCards';frame.setAttribute('allow','clipboard-read; clipboard-write');frame.srcdoc=html;
  frame.onload=()=>document.getElementById('loading')?.remove();
  document.body.appendChild(frame);
 }catch(e){
  document.getElementById('loading').innerHTML='<div class="box"><b>JucaCards</b><p>Erro ao inicializar a plataforma.</p><p style="font-size:13px">'+String(e.message||e)+'</p></div>';
  console.error(e);
 }
})();
</script>
</body>
</html>
