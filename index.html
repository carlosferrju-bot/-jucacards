<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b45">
<title>JucaCards</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#12213a}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#loading .box{max-width:520px;padding:32px;border:1px solid #dce4f0;border-radius:18px;background:#fff;box-shadow:0 20px 50px #10204014}
#loading b{font-size:24px}#loading p{color:#66758f;line-height:1.5}
</style>
</head>
<body>
<div id="loading"><div class="box"><b>JucaCards</b><p>Carregando sua plataforma completa de estudos…</p></div></div>
<script>
(async()=>{
  try{
    const files=['./source/chunk01.txt','./source/chunk02.txt','./source/chunk03.txt','./source/chunk04.txt'];
    const parts=await Promise.all(files.map(async file=>{
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error('Não foi possível carregar '+file+'.');
      return r.text();
    }));
    const html=parts.join('');
    if(!html.includes('<!DOCTYPE html>') && !html.includes('<!doctype html>')) throw new Error('Fonte da plataforma inválida.');

    // Camada responsiva adicional: preserva o HTML original e adapta a mesma
    // interface para telas menores, sem duplicar páginas ou funcionalidades.
    const responsiveStyle=`<style id="jucacards-responsive">
      @media (max-width:1100px){
        .flash-wrap{grid-template-columns:200px minmax(0,1fr)}
        .flash-wrap>.flash-side:last-child{grid-column:1/-1;min-height:auto}
        .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
        .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      }
      @media (max-width:800px){
        .sidebar{width:82px;padding:14px 9px}
        .brand{justify-content:center;padding:4px 0 18px}
        .brand>div:last-child,.sidebar-bottom{display:none}
        .nav button{justify-content:center;padding:11px 8px}
        .nav button .icon{width:auto}
        .nav button{font-size:0}
        .nav button .icon{font-size:18px}
        .main{margin-left:82px;width:calc(100% - 82px);padding:18px}
        .topbar{align-items:flex-start}
        .title h1{font-size:24px}
        .search{width:220px;max-width:100%}
        .two,.three{grid-template-columns:1fr}
        .cards-grid{grid-template-columns:1fr}
        .flash-wrap{grid-template-columns:1fr}
        .flash-side{min-height:auto}
        .flash-stage{min-height:auto}
      }
      @media (max-width:600px){
        .app{display:block}
        .sidebar{position:sticky;top:0;left:0;inset:auto;width:100%;height:auto;min-height:0;padding:8px 10px;display:flex;align-items:center;gap:10px;overflow:hidden;border-right:0;border-bottom:1px solid var(--line);background:rgba(8,12,24,.96)}
        .brand{padding:0;flex:0 0 auto}
        .brand>div:last-child{display:none}
        .logo{width:38px;height:38px;border-radius:11px}
        .nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
        .nav::-webkit-scrollbar{display:none}
        .nav button{flex:0 0 auto;width:auto;min-width:42px;padding:10px;border-radius:10px;font-size:0}
        .nav button .icon{font-size:17px}
        .main{margin:0;width:auto;padding:14px 12px 28px}
        .topbar{display:block;margin-bottom:16px}
        .actions{margin-top:12px}
        .actions .btn{flex:1 1 auto}
        .stats{grid-template-columns:1fr 1fr;gap:10px}
        .stat{padding:14px;border-radius:14px}
        .stat strong{font-size:23px}
        .card{padding:15px;border-radius:15px}
        .form-grid{grid-template-columns:1fr}
        .field.full{grid-column:auto}
        .modal{padding:8px}
        .modal-box{max-height:96vh;border-radius:17px}
        .modal-body{padding:15px}
        .modal-foot{padding:12px 15px}
        .toolbar{align-items:stretch}
        .toolbar select,.toolbar input,.toolbar .btn{width:100%}
        .search{width:100%;box-sizing:border-box}
        .flashcard,.flash-inner{min-height:58vh}
        .face{padding:22px 16px}
        .face-content{padding:8px 4px;font-size:var(--flash-font-size,18px)}
        .flash-font-controls{top:10px;right:10px}
        .deck-actions{flex-wrap:wrap}
        .deck-actions button{min-width:120px}
      }
    </style>`;
    const styledHtml=html.replace(/<\/head>/i,responsiveStyle+'</head>');
    document.open();document.write(styledHtml);document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="box"><b>JucaCards</b><p>Não foi possível carregar a plataforma completa.</p><p style="font-size:13px">'+String(e.message||e)+'</p></div>';
  }
})();
</script>
</body>
</html>
