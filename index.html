<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JucaCards</title><style>:root{--bg:#080c18;--panel:#10172a;--panel2:#121a2e;--line:#202b45;--text:#edf3ff;--muted:#8e9ab5;--primary:#6d5dfc;--blue:#45a3ff;--green:#23c483;--red:#ff5c77;--yellow:#f4b740}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;padding:20px 14px;background:var(--panel);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;font-size:20px;font-weight:800}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--blue));display:grid;place-items:center;font-weight:900}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:left;display:flex;gap:11px;width:100%}.nav button.on,.nav button:hover{background:#171d33;color:#fff}.main{margin-left:245px;padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.good{background:#123b2d;border-color:#1d7558;color:#fff}.btn.warn{background:#4a3814;border-color:#80601d;color:#fff}.btn.danger{background:#401b25;border-color:#743040;color:#fff}.theme{width:44px;height:44px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.5fr 1fr}.cards{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px}.stat strong{display:block;font-size:28px;margin-top:6px}.bar{height:8px;background:#202941;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue))}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.grow{flex:1;min-width:0}.list{display:grid;gap:9px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.toolbar .input{flex:1;min-width:200px}.empty{text-align:center;padding:45px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:16px}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted)}textarea.input{min-height:150px;resize:vertical}.quick{position:fixed;inset:0;background:#0009;display:none;place-items:start center;padding:7vh 16px;z-index:100}.quick.show{display:grid}.quickbox{width:min(670px,100%);max-height:82vh;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px}.quickhead{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.quickinput{padding:16px}.quickinput input{width:100%;padding:14px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px}.results{max-height:56vh;overflow:auto;padding:4px 16px 20px}.result{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px;margin-top:8px}.study-view{min-height:calc(100vh - 130px);display:flex;flex-direction:column;gap:18px}.study-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.study-tools{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.study-tools button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--text);min-width:46px;height:40px;font-weight:800}.study-tools button:last-child{border-right:0}.study-card{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 38px 24px;display:flex;flex-direction:column;overflow:hidden}.study-card.clickable{cursor:pointer}.study-card.clickable:hover{border-color:#46577f;box-shadow:0 18px 55px #0006}.study-inner{max-width:1000px;width:100%;margin:auto;flex:1;min-height:0;display:flex;flex-direction:column}.study-scroll{flex:1;min-height:0;overflow:auto;padding:2px 14px 16px 2px}.study-question{font-size:calc(20px * var(--scale));line-height:1.58}.study-question img{max-width:100%;height:auto}.study-question table{max-width:100%;overflow:auto;display:block}.study-answer{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);font-size:calc(17px * var(--scale));line-height:1.65}.answer-label{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--primary);margin-bottom:8px}.study-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding-top:16px}.study-actions .btn{min-height:52px;padding:12px 22px;font-weight:700}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:3px}.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.progressbar{width:110px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}.progressbar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue))}.study-view:fullscreen{background:var(--bg);padding:24px 34px}.fallback{position:fixed!important;inset:0!important;z-index:200;background:var(--bg);padding:22px!important}@media(max-width:950px){.side{width:78px}.brand span,.nav span{display:none}.nav button{justify-content:center}.main{margin-left:78px}.stats,.cards,.two{grid-template-columns:1fr 1fr}}@media(max-width:620px){.side{position:sticky;width:100%;height:auto;padding:8px;display:flex}.brand{padding:0}.brand span{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:43px;width:43px;font-size:0}.nav i{font-size:16px}.main{margin:0;padding:15px}.top{align-items:center}.title h1{font-size:23px}.stats,.cards,.two{grid-template-columns:1fr}.study-card{padding:18px 14px 14px;border-radius:18px}.study-view{min-height:calc(100vh - 95px)}}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#18213a;color:#cbd5ff;font-size:12px}.hide{display:none!important}.htmlcontent{line-height:1.65;overflow-wrap:anywhere}

</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">JC</div><span>JucaCards</span></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div class="title"><h1 id="heading">Dashboard</h1><div class="muted" id="sub">Seu centro de estudos</div></div><div class="actions"><button class="btn theme" id="theme" onclick="toggleTheme()">☾</button><button class="btn" onclick="openQuick()">⌕ Buscar</button><button class="btn" onclick="backup()">Exportar</button><button class="btn primary" onclick="openCard()">+ Novo flashcard</button></div></header><section id="page"></section></main></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="quick-search-backdrop" id="quickSearch" role="dialog" aria-modal="true" aria-label="Busca rápida">
  <div class="quick-search">

</div>
<div class="quick" id="quick"><div class="quickbox"><div class="quickhead"><h2>Busca rápida</h2><button class="btn" onclick="closeQuick()">×</button></div><div class="quickinput"><input id="qi" placeholder="Pesquisar flashcards, concursos ou disciplinas..." oninput="quickResults()"></div><div class="results" id="results"></div></div></div><input id="import" type="file" accept="application/json" class="hide" onchange="importData(event)"><script>const KEY='jucacards_data',$=id=>document.getElementById(id);let D=load(),S={page:'dashboard',deck:'',filter:'',studyId:null,showAnswer:false,font:100};const NAV=[['dashboard','⌂','Dashboard'],['decks','▦','Concursos'],['cards','▤','Flashcards'],['study','◉','Estudar'],['reviews','◫','Revisões'],['stats','◒','Estatísticas'],['settings','⚙','Configurações']];function uid(){return'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function def(){return{cards:[],decks:[{id:'d0',name:'Geral',desc:'Coleção padrão.',color:'#6d5dfc',disciplines:[]}],reviews:[],settings:{name:'Carlos',theme:'dark',initial:3,hard:1,good:4,easy:7,max:365}}}function norm(x){let o=def(),ds=Array.isArray(x?.decks)?x.decks:[];if(ds.length)o.decks=ds.map((d,i)=>typeof d==='string'?{id:'d'+i,name:d,desc:'',color:'#6d5dfc',disciplines:[]}:{id:String(d.id||uid()),name:String(d.name||'Sem nome'),desc:String(d.desc||''),color:d.color||'#6d5dfc',disciplines:Array.isArray(d.disciplines)?d.disciplines.map(String):[]});let map=new Map(o.decks.map(d=>[d.id,d]));o.cards=(Array.isArray(x?.cards)?x.cards:[]).map(c=>{let id=String(c.deck||'');if(!map.has(id)){let by=o.decks.find(d=>d.name===id);if(by)id=by.id;else{o.decks.push({id:id||uid(),name:id||'Geral',desc:'',color:'#6d5dfc',disciplines:[]});id=o.decks[o.decks.length-1].id}}let next=c.next??(c.due==null?null:new Date(Number(c.due)).toISOString());return{id:String(c.id||uid()),deck:id,discipline:String(c.discipline||''),q:String(c.front??c.q??''),a:String(c.back??c.a??''),tags:String(c.tags||''),source:String(c.source||''),type:String(c.type||'normal'),correct:c.correct??null,next,reps:Number(c.reps||0),interval:Number(c.interval||0),ease:Number(c.ease||2.5),seen:!!c.seen,lastAnswer:c.lastAnswer??null,lastAnswerCorrect:c.lastAnswerCorrect??null}});o.reviews=Array.isArray(x?.reviews)?x.reviews:[];o.settings={...o.settings,...(x?.settings||{})};return o}function recoverLastGood(){
try{
  const raw=localStorage.getItem(KEY+'_last_good');
  if(!raw)return false;
  const x=norm(JSON.parse(raw));
  if(x.cards.length||x.decks.length||x.reviews.length){D=x;localStorage.setItem(KEY,JSON.stringify(D));return true}
}catch(e){}
return false;
}
function load(){
try{
  const stable=localStorage.getItem(KEY);
  const candidates=[stable,localStorage.getItem('jucacards_rebuild_v3'),localStorage.getItem('jucacards_rebuild_v2'),localStorage.getItem('jucacards_rebuild_v1'),localStorage.getItem('jucacards_rebuild_v0')];
  for(const raw of candidates){
    if(!raw)continue;
    try{
      const parsed=JSON.parse(raw);
      if(parsed && typeof parsed==='object' && (Array.isArray(parsed.cards)||Array.isArray(parsed.decks))){
        const data=norm(parsed);
        if(!stable && (data.cards.length||data.decks.length||data.reviews.length)){
          localStorage.setItem(KEY,JSON.stringify(data));
          localStorage.setItem(KEY+'_migration_backup',raw);
        }
        return data;
      }
    }catch(e){}
  }
}catch(e){}
return def();
}
function save(){
try{
  const incoming=JSON.stringify(D);
  const current=localStorage.getItem(KEY);
  if(current){
    try{
      const old=JSON.parse(current);
      const oldCount=(Array.isArray(old.cards)?old.cards.length:0)+(Array.isArray(old.decks)?old.decks.length:0)+(Array.isArray(old.reviews)?old.reviews.length:0);
      const newCount=(Array.isArray(D.cards)?D.cards.length:0)+(Array.isArray(D.decks)?D.decks.length:0)+(Array.isArray(D.reviews)?D.reviews.length:0);
      if(oldCount>0 && newCount===0)return;
    }catch(e){}
  }
  localStorage.setItem(KEY,incoming);
  localStorage.setItem(KEY+'_last_good',incoming);
}catch(e){
  try{localStorage.setItem(KEY+'_last_good',JSON.stringify(D))}catch(_){}
}
}
function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function strip(s){let e=document.createElement('div');e.innerHTML=s||'';return e.textContent||''}function due(c){return!c.next||new Date(c.next)<=new Date()}function deck(id){return D.decks.find(d=>d.id===id)||D.decks[0]}function dn(id){return deck(id)?.name||'Geral'}function pct(a,b){return b?Math.round(a/b*100):0}function view(p){S.page=p;S.showAnswer=false;let n=NAV.find(n=>n[0]===p);$('heading').textContent=n?.[2]||'Dashboard';$('sub').textContent=p==='study'?'Sessão de estudo':p==='dashboard'?'Seu centro de estudos':'Gerencie seu estudo';nav();render()}function nav(){$('nav').innerHTML=NAV.map(n=>`<button class="${S.page===n[0]?'on':''}" onclick="view('${n[0]}')"><i>${n[1]}</i><span>${n[2]}</span></button>`).join('')}function render(){let p=$('page');p.innerHTML=S.page==='dashboard'?dashboard():S.page==='decks'?decks():S.page==='cards'?cards():S.page==='study'?study():S.page==='reviews'?reviews():S.page==='stats'?stats():settings();applyTheme()}function dashboard(){let t=D.cards.length,d=D.cards.filter(due).length,s=D.cards.filter(c=>c.reps>0).length;return`<div class="grid stats"><div class="card stat"><div class="muted">Flashcards</div><strong>${t}</strong></div><div class="card stat"><div class="muted">Para revisar</div><strong>${d}</strong></div><div class="card stat"><div class="muted">Concursos</div><strong>${D.decks.length}</strong></div><div class="card stat"><div class="muted">Progresso</div><strong>${pct(s,t)}%</strong><div class="bar"><span style="width:${pct(s,t)}%"></span></div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Continue estudando</h3><div class="row"><div class="grow"><b>${d?'Revisões pendentes':'Todos os flashcards'}</b><div class="muted">${d?d+' cartão(ões)':'Sua biblioteca está pronta'}</div></div><button class="btn primary" onclick="view('${d?'reviews':'study'}')">Começar</button></div></div><div class="card"><h3>Concursos</h3><div class="list">${D.decks.map(d=>`<div class="row"><div class="grow"><b>${esc(d.name)}</b><div class="muted">${D.cards.filter(c=>c.deck===d.id).length} flashcards</div></div><button class="btn" onclick="S.deck='${d.id}';view('cards')">Abrir</button></div>`).join('')}</div></div></div>`}function decks(){return`<div class="toolbar"><button class="btn primary" onclick="openDeck()">+ Novo concurso</button></div><div class="grid cards">${D.decks.map(d=>`<div class="card"><h3>${esc(d.name)}</h3><div class="muted">${esc(d.desc)}</div><p>${D.cards.filter(c=>c.deck===d.id).length} cards · ${d.disciplines.length} disciplinas</p><button class="btn" onclick="openDeck('${d.id}')">Editar</button></div>`).join('')}</div>`}function cards(){let a=D.cards.filter(c=>(!S.deck||c.deck===S.deck)&&(!S.filter||(c.q+c.a+c.tags+c.discipline+dn(c.deck)).toLowerCase().includes(S.filter.toLowerCase())));return`<div class="toolbar"><input class="input" placeholder="Pesquisar flashcards..." value="${esc(S.filter)}" oninput="S.filter=this.value;render()"><select class="input" style="max-width:250px" onchange="S.deck=this.value;render()"><option value="">Todos os concursos</option>${D.decks.map(d=>`<option value="${d.id}" ${S.deck===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><button class="btn" onclick="S={...S,deck:'',filter:''};render()">Limpar</button></div><div class="muted">${a.length} flashcard(s)</div><div class="grid cards" style="margin-top:12px">${a.map(c=>`<div class="card"><div class="small muted">${esc(dn(c.deck))} · ${esc(c.discipline)}</div><div class="htmlcontent" style="margin:12px 0">${c.q}</div><div class="actions"><button class="btn" onclick="openCard('${c.id}')">Editar</button><button class="btn primary" onclick="start('${c.id}')">Estudar</button><button class="btn danger" onclick="del('${c.id}')">Excluir</button></div></div>`).join('')||'<div class="card empty">Nenhum flashcard encontrado.</div>'}</div>`}function study(){let c=S.studyId?D.cards.find(x=>x.id===S.studyId):D.cards.find(due)||D.cards[0];if(!c)return'<div class="card empty">Você ainda não possui flashcards. Crie ou importe um backup.</div>';S.studyId=c.id;let i=D.cards.findIndex(x=>x.id===c.id)+1,t=D.cards.length;return`<div id="studyView" class="study-view" style="--scale:${S.font/100}"><div class="study-toolbar"><div class="muted">${esc(dn(c.deck))} · ${esc(c.discipline||'Sem disciplina')}</div><div class="study-tools"><button onclick="font(-10);event.stopPropagation()">A−</button><button onclick="font(0);event.stopPropagation()">${S.font}%</button><button onclick="font(10);event.stopPropagation()">A+</button><button onclick="fullscreen();event.stopPropagation()">⛶</button></div></div><div class="study-card ${S.showAnswer?'':'clickable'}" onclick="flip(event)"><div class="study-inner"><div class="study-scroll"><div class="small muted">${c.reps?'Repetições: '+c.reps:'Novo card'}${c.type==='tf'?' · Certo/Errado':''}</div><div class="study-question htmlcontent" style="margin-top:16px">${c.q}</div>${S.showAnswer?`<div class="study-answer htmlcontent"><div class="answer-label">RESPOSTA / GABARITO</div>${c.a}</div>`:''}</div><div class="study-actions">${S.showAnswer?`<button class="btn danger" onclick="rate('${c.id}',0,event)">Errei</button><button class="btn warn" onclick="rate('${c.id}',1,event)">Difícil</button><button class="btn good" onclick="rate('${c.id}',2,event)">Bom</button><button class="btn primary" onclick="rate('${c.id}',3,event)">Fácil</button>`:`<button class="btn" onclick="skip(event)">Pular</button>`}</div><div class="hint">${S.showAnswer?'Avalie a dificuldade para continuar':'Clique em qualquer área do card para virar'}</div></div></div><div class="progress"><span>${i} / ${t}</span><div class="progressbar"><span style="width:${pct(i,t)}%"></span></div><button class="btn" onclick="skip(event)">Próximo</button></div></div>`}function flip(e){if(e?.button!==undefined&&e.button!==0)return;if(e?.target?.closest('button,input,select,textarea,a'))return;if(!S.showAnswer){S.showAnswer=true;render()}}function skip(e){e?.stopPropagation();let cur=S.studyId,n=D.cards.find(x=>x.id!==cur&&due(x))||D.cards.find(x=>x.id!==cur);S.studyId=n?.id||null;S.showAnswer=false;render()}function start(id){S.studyId=id;S.showAnswer=false;view('study')}function font(n){S.font=n===0?100:Math.max(80,Math.min(140,S.font+n));render()}function fullscreen(){let e=$('studyView');if(!e)return;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen();else e.classList.toggle('fallback')}function rate(id,r,e){e?.stopPropagation();let c=D.cards.find(x=>x.id===id),now=Date.now(),days=r===0?0:r===1?Math.max(1,(c.interval||1)*.5):r===2?Math.max(1,(c.interval||0)+Number(D.settings.good||4)):Math.max(1,(c.interval||0)*1.8+Number(D.settings.easy||7));c.reps=(c.reps||0)+1;c.interval=Math.min(Number(D.settings.max||365),days);c.ease=Math.max(1.3,(c.ease||2.5)+(r===3?.15:r===1?-.15:0));c.next=r===0?null:new Date(now+days*86400000).toISOString();c.seen=true;c.lastAnswer=['Errei','Difícil','Bom','Fácil'][r];c.lastAnswerCorrect=r>0;D.reviews.push({id:uid(),card:id,rating:r,at:now});save();S.showAnswer=false;let n=D.cards.find(x=>x.id!==id&&due(x));S.studyId=n?.id||null;render()}function reviews(){let a=D.cards.filter(due);return`<div class="card"><h3>Revisões pendentes</h3><div class="muted">${a.length} card(s)</div><button class="btn primary" onclick="view('study')">Estudar</button></div><div class="grid cards" style="margin-top:16px">${a.map(c=>`<div class="card"><div class="muted">${esc(dn(c.deck))} · ${esc(c.discipline)}</div><div style="margin:10px 0">${c.q}</div><button class="btn primary" onclick="start('${c.id}')">Revisar</button></div>`).join('')||'<div class="card empty">Nada pendente. Excelente!</div>'}</div>`}function stats(){let by={};D.cards.forEach(c=>by[c.discipline||'Sem disciplina']=(by[c.discipline||'Sem disciplina']||0)+1);return`<div class="grid stats"><div class="card stat"><div class="muted">Total</div><strong>${D.cards.length}</strong></div><div class="card stat"><div class="muted">Revisados</div><strong>${D.cards.filter(c=>c.reps>0).length}</strong></div><div class="card stat"><div class="muted">Pendentes</div><strong>${D.cards.filter(due).length}</strong></div><div class="card stat"><div class="muted">Revisões</div><strong>${D.reviews.length}</strong></div></div><div class="card" style="margin-top:16px"><h3>Cards por disciplina</h3>${Object.entries(by).map(([k,v])=>`<div class="row" style="margin-top:8px"><b>${esc(k)}</b><strong>${v}</strong></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div>`}function settings(){return`<div class="grid two"><div class="card"><h3>Preferências</h3><div class="form"><label>Nome<input class="input" id="name" value="${esc(D.settings.name||'Carlos')}"></label><button class="btn primary" onclick="saveSettings()">Salvar alterações</button></div></div><div class="card"><h3>Dados</h3><div class="muted">Importe o backup da versão HTML e mantenha cards, concursos e revisões.</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="openImport()">Importar backup</button><button class="btn" onclick="backup()">Exportar backup</button></div></div></div>`}function openModal(x){$('modalbox').innerHTML=x;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function openDeck(id){let d=id?deck(id):{name:'',desc:'',color:'#6d5dfc',disciplines:[]};openModal(`<h2>${id?'Editar':'Novo'} concurso</h2><div class="form"><label>Nome<input class="input" id="dn" value="${esc(d.name)}"></label><label>Descrição<input class="input" id="dd" value="${esc(d.desc)}"></label><label>Disciplinas<textarea class="input" id="di">${esc((d.disciplines||[]).join('\n'))}</textarea></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveDeck('${id||''}')">Salvar</button></div></div>`)}function saveDeck(id){let n=$('dn').value.trim();if(!n)return alert('Informe o nome.');let d=id?deck(id):{id:uid(),name:'',desc:'',color:'#6d5dfc',disciplines:[]};Object.assign(d,{name:n,desc:$('dd').value.trim(),disciplines:$('di').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean)});if(!id)D.decks.push(d);save();closeModal();render()}function openCard(id){let c=id?D.cards.find(x=>x.id===id):{deck:S.deck||D.decks[0]?.id||'',discipline:'',q:'',a:'',tags:'',source:'',type:'normal',correct:null};openModal(`<h2>${id?'Editar':'Novo'} flashcard</h2><div class="form"><label>Concurso<select class="input" id="cd">${D.decks.map(d=>`<option value="${d.id}" ${c.deck===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Disciplina<input class="input" id="cp" value="${esc(c.discipline)}"></label><label>Frente / questão<textarea class="input" id="cq">${esc(c.q)}</textarea></label><label>Verso / resposta<textarea class="input" id="ca">${esc(c.a)}</textarea></label><label>Tags<input class="input" id="ct" value="${esc(c.tags)}"></label><label>Fonte<input class="input" id="cs" value="${esc(c.source)}"></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCard('${id||''}')">Salvar</button></div></div>`)}function saveCard(id){let o={deck:$('cd').value,discipline:$('cp').value.trim(),q:$('cq').value,a:$('ca').value,tags:$('ct').value.trim(),source:$('cs').value.trim()};if(id)Object.assign(D.cards.find(c=>c.id===id),o);else D.cards.push({...o,id:uid(),next:null,reps:0,interval:0,ease:2.5,seen:false,lastAnswer:null,lastAnswerCorrect:null,type:'normal'});save();closeModal();render()}function del(id){if(confirm('Excluir este flashcard?')){D.cards=D.cards.filter(c=>c.id!==id);D.reviews=D.reviews.filter(r=>r.card!==id);save();render()}}function backup(){let p={decks:D.decks,cards:D.cards.map(c=>({...c,front:c.q,back:c.a,due:c.next?new Date(c.next).getTime():null})),reviews:D.reviews,settings:D.settings};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='jucacards-backup.json';a.click()}function openImport(){$('import').value='';$('import').click()}function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=norm(JSON.parse(r.result));if(!confirm(`Backup encontrado: ${x.cards.length} flashcards e ${x.decks.length} concursos.\n\nOK = substituir os dados atuais\nCancelar = mesclar`)){let names=new Map(D.decks.map(d=>[d.name,d.id]));x.decks.forEach(d=>{if(!names.has(d.name)){d.id=uid();D.decks.push(d);names.set(d.name,d.id)}});x.cards.forEach(c=>D.cards.push({...c,id:D.cards.some(y=>y.id===c.id)?uid():c.id,deck:names.get(dn(c.deck))||D.decks[0].id}));D.reviews.push(...x.reviews)}else D=x;save();S={page:'dashboard',deck:'',filter:'',studyId:null,showAnswer:false,font:100};nav();render();alert('Importação concluída.')}catch(err){alert('Arquivo inválido: '+err.message)}};r.readAsText(f)}function saveSettings(){D.settings.name=$('name').value.trim()||'Carlos';save();alert('Configurações salvas.')}function toggleTheme(){D.settings.theme=D.settings.theme==='light'?'dark':'light';if(D.settings.theme==='light'){document.documentElement.style.setProperty('--bg','#f4f7fb');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#f7f9fd');document.documentElement.style.setProperty('--line','#dce3ef');document.documentElement.style.setProperty('--text','#172033');document.documentElement.style.setProperty('--muted','#647089')}else{document.documentElement.style.setProperty('--bg','#080c18');document.documentElement.style.setProperty('--panel','#10172a');document.documentElement.style.setProperty('--panel2','#121a2e');document.documentElement.style.setProperty('--line','#202b45');document.documentElement.style.setProperty('--text','#edf3ff');document.documentElement.style.setProperty('--muted','#8e9ab5')}save();applyTheme()}function applyTheme(){$('theme').textContent=D.settings.theme==='light'?'☀':'☾'}function openQuick(){$('quick').classList.add('show');$('qi').value='';quickResults();setTimeout(()=>$('qi').focus(),30)}function closeQuick(){$('quick').classList.remove('show')}function quickResults(){let q=$('qi').value.trim().toLowerCase();if(!q){$('results').innerHTML='<div class="empty">Digite para pesquisar.</div>';return}let a=D.cards.filter(c=>(c.q+c.a+c.tags+c.discipline+dn(c.deck)).toLowerCase().includes(q));$('results').innerHTML=a.map(c=>`<button class="result" onclick="closeQuick();start('${c.id}')"><b>${esc(strip(c.q).slice(0,120))}</b><div class="muted">${esc(dn(c.deck))} · ${esc(c.discipline)}</div></button>`).join('')||'<div class="empty">Nenhum resultado.</div>'}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openQuick()}if(e.key==='Escape'){closeQuick();closeModal()}});$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});nav();render();
init();
</script><script src="/sync.js"></script></body></html>
