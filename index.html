<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b45"><title>JucaCards — Flashcards</title>
<style>
:root{--bg:#07101f;--panel:#0d1930;--panel2:#111f3b;--text:#f5f7fb;--muted:#91a0ba;--line:#223556;--accent:#3b82f6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#102858 0,#07101f 42%);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:250px;background:rgba(7,16,31,.92);border-right:1px solid var(--line);padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-weight:900;font-size:24px;margin:4px 8px 26px}.brand span{color:#60a5fa}.nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);padding:12px 14px;border-radius:10px;margin:4px 0}.nav button.active,.nav button:hover{background:#122747;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:9px;background:#172845;color:#fff;border:1px solid var(--line)}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{background:#3b1820;border-color:#6b2530}.btn.ok{background:#123c29;border-color:#1f7049}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,25,48,.88);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 12px 30px #0002}.metric b{font-size:30px;display:block;margin-top:6px}.muted{color:var(--muted)}.section{margin-top:20px}.section h2{font-size:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.input{width:100%;background:#09152a;border:1px solid var(--line);color:#fff;padding:11px 12px;border-radius:9px;outline:none}.input:focus{border-color:#4d8cf7}.toolbar .input{max-width:380px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0d1930;border:1px solid var(--line);border-radius:12px;padding:14px}.row strong{display:block}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tag{font-size:12px;color:#bcd1f4;background:#14294b;padding:4px 8px;border-radius:999px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(650px,100%);background:#0d1930;border:1px solid var(--line);border-radius:16px;padding:20px}.form{display:grid;gap:12px}.form label{font-size:13px;color:#aab8cf}.study{max-width:900px;margin:auto}.flash{min-height:360px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#122747,#0b1730);border:1px solid #2a4774;border-radius:20px;padding:40px;perspective:1000px}.flash .inner{max-width:720px}.flash .q{font-size:28px;font-weight:800;line-height:1.3}.flash .a{margin-top:24px;color:#c8d5e9;font-size:19px;white-space:pre-wrap}.study-actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}.progress{height:8px;background:#14223a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.empty{text-align:center;padding:50px;color:var(--muted)}.check{color:var(--ok)}@media(max-width:900px){.side{width:72px;padding:18px 8px}.brand{font-size:0;text-align:center}.brand:after{content:'JC';font-size:22px;color:#60a5fa}.nav button{font-size:0;text-align:center}.nav button:before{font-size:20px}.nav button:nth-child(1):before{content:'⌂'}.nav button:nth-child(2):before{content:'▣'}.nav button:nth-child(3):before{content:'▶'}.nav button:nth-child(4):before{content:'⚙'}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.main{padding:12px}.flash{min-height:300px;padding:25px}.flash .q{font-size:22px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Juca<span>Cards</span></div><nav class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="decks">Baralhos</button><button data-page="study">Estudar</button><button data-page="settings">Configurações</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="subtitle">Sua central de revisão.</div></div><div class="actions"><button class="btn" id="theme">☾ Tema</button><button class="btn primary" id="newCard">+ Novo flashcard</button></div></div>
<section id="dashboard" class="page"><div class="grid"><div class="card metric"><span class="muted">Baralhos</span><b id="mDecks">0</b></div><div class="card metric"><span class="muted">Flashcards</span><b id="mCards">0</b></div><div class="card metric"><span class="muted">Para revisar</span><b id="mDue">0</b></div><div class="card metric"><span class="muted">Acertos</span><b id="mHits">0%</b></div></div><div class="section card"><h2>Revisão de hoje</h2><div id="dueList" class="list"></div></div></section>
<section id="decks" class="page hidden"><div class="toolbar"><input class="input" id="search" placeholder="Buscar baralho ou flashcard..."><button class="btn primary" id="newDeck">+ Novo baralho</button></div><div id="deckList" class="list"></div></section>
<section id="study" class="page hidden"><div class="study"><div class="card"><div class="toolbar"><select class="input" id="studyDeck"></select><button class="btn" id="shuffle">Embaralhar</button></div><div class="progress"><i id="studyProgress" style="width:0%"></i></div></div><div class="flash"><div class="inner"><div class="muted" id="studyCount">Nenhum card</div><div class="q" id="question">Escolha um baralho para começar.</div><div class="a hidden" id="answer"></div></div></div><div class="study-actions"><button class="btn primary" id="show">Mostrar resposta</button><button class="btn danger hidden" id="wrong">Errei</button><button class="btn ok hidden" id="right">Acertei</button></div></div></section>
<section id="settings" class="page hidden"><div class="card"><h2>Dados</h2><p class="muted">Seus baralhos ficam salvos neste navegador. Exporte uma cópia para levar seus estudos para outro dispositivo.</p><div class="actions"><button class="btn" id="export">Exportar backup</button><label class="btn">Importar backup<input id="import" type="file" accept="application/json" hidden></label><button class="btn danger" id="reset">Apagar dados</button></div></div></section></main></div>
<div class="modal hidden" id="modal"><div class="modalbox"><h2 id="modalTitle">Novo flashcard</h2><div class="form"><label>Baralho<select class="input" id="fDeck"></select></label><label>Pergunta<textarea class="input" id="fQ" rows="4"></textarea></label><label>Resposta<textarea class="input" id="fA" rows="5"></textarea></label><label>Disciplina<input class="input" id="fDisc" placeholder="Ex.: Direito Constitucional"></label><div class="actions"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Salvar</button></div></div></div></div>
<script>
const KEY='jucacards_v3';const today=()=>new Date().toISOString().slice(0,10);let state=JSON.parse(localStorage.getItem(KEY)||'null')||{decks:[{id:'d1',name:'Meu primeiro baralho'}],cards:[],hits:0,answers:0};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let studyCards=[],idx=0,answered=false;
function due(c){return !c.next||c.next<=today()}function render(){
 $('#mDecks').textContent=state.decks.length;$('#mCards').textContent=state.cards.length;let dueCards=state.cards.filter(due);$('#mDue').textContent=dueCards.length;$('#mHits').textContent=state.answers?Math.round(state.hits/state.answers*100)+'%':'0%';
 $('#dueList').innerHTML=dueCards.length?dueCards.slice(0,8).map(c=>`<div class="row"><div><strong>${esc(c.q)}</strong><div class="tags"><span class="tag">${esc(deck(c.deck)?.name||'Sem baralho')}</span><span class="tag">${esc(c.disc||'Geral')}</span></div></div><button class="btn" onclick="startCard('${c.id}')">Estudar</button></div>`).join(''):'<div class="empty">Tudo em dia. Adicione cards ou continue revisando.</div>';
 $('#deckList').innerHTML=state.decks.map(d=>{let n=state.cards.filter(c=>c.deck===d.id).length;return `<div class="row"><div><strong>${esc(d.name)}</strong><span class="muted">${n} flashcard(s)</span></div><div class="actions"><button class="btn primary" onclick="startDeck('${d.id}')">Estudar</button><button class="btn" onclick="addCard('${d.id}')">+ Card</button></div></div>`}).join('')||'<div class="empty">Crie seu primeiro baralho.</div>';populate();save();}
function deck(id){return state.decks.find(d=>d.id===id)}function populate(){let opts=state.decks.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');$('#studyDeck').innerHTML=opts;$('#fDeck').innerHTML=opts}
function page(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('#title').textContent={dashboard:'Dashboard',decks:'Baralhos',study:'Estudar',settings:'Configurações'}[p];$('#subtitle').textContent={dashboard:'Sua central de revisão.',decks:'Organize seus conhecimentos.',study:'Revisão espaçada simples e rápida.',settings:'Backup e preferências.'}[p];if(p==='study')startDeck($('#studyDeck').value)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));$('#theme').onclick=()=>{document.body.classList.toggle('light');document.documentElement.style.setProperty('--bg',document.body.classList.contains('light')?'#eef3fa':'#07101f')};
function openModal(deckId){$('#modal').classList.remove('hidden');$('#fQ').value='';$('#fA').value='';$('#fDisc').value='';if(deckId)$('#fDeck').value=deckId}function closeModal(){$('#modal').classList.add('hidden')}$('#cancel').onclick=closeModal;$('#newCard').onclick=()=>openModal();function addCard(d){openModal(d)}
$('#save').onclick=()=>{let q=$('#fQ').value.trim(),a=$('#fA').value.trim();if(!q||!a)return alert('Preencha pergunta e resposta.');state.cards.push({id:id(),deck:$('#fDeck').value,q,a,disc:$('#fDisc').value.trim()||'Geral',next:today(),interval:0});closeModal();render()};
$('#newDeck').onclick=()=>{let n=prompt('Nome do baralho:');if(n?.trim()){state.decks.push({id:id(),name:n.trim()});render()}};
function startDeck(d){page('study');$('#studyDeck').value=d;studyCards=state.cards.filter(c=>c.deck===d);idx=0;answered=false;showStudy()}function startCard(cid){let c=state.cards.find(x=>x.id===cid);page('study');$('#studyDeck').value=c.deck;studyCards=[c];idx=0;answered=false;showStudy()}window.startDeck=startDeck;window.startCard=startCard;window.addCard=addCard;
function showStudy(){let c=studyCards[idx];if(!c){$('#question').textContent='Nenhum flashcard neste baralho.';$('#answer').classList.add('hidden');return}$('#studyCount').textContent=`${idx+1} / ${studyCards.length}`;$('#studyProgress').style.width=((idx+1)/studyCards.length*100)+'%';$('#question').textContent=c.q;$('#answer').textContent=c.a;$('#answer').classList.add('hidden');$('#show').classList.remove('hidden');$('#wrong').classList.add('hidden');$('#right').classList.add('hidden');answered=false}
$('#show').onclick=()=>{if(!studyCards[idx])return;$('#answer').classList.remove('hidden');$('#show').classList.add('hidden');$('#wrong').classList.remove('hidden');$('#right').classList.remove('hidden');answered=true};function rate(ok){let c=studyCards[idx];state.answers++;if(ok)state.hits++;c.interval=ok?Math.min((c.interval||1)*2,30):1;let d=new Date();d.setDate(d.getDate()+c.interval);c.next=d.toISOString().slice(0,10);idx++;save();render();showStudy()}$('#right').onclick=()=>rate(true);$('#wrong').onclick=()=>rate(false);$('#shuffle').onclick=()=>{studyCards.sort(()=>Math.random()-.5);idx=0;showStudy()};
$('#search').oninput=e=>{let t=e.target.value.toLowerCase();document.querySelectorAll('#deckList .row').forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(t)))};
$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jucacards-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.decks)||!Array.isArray(x.cards))throw 0;state=x;render();alert('Backup importado.')}catch{alert('Backup inválido.')}};r.readAsText(f)};
$('#reset').onclick=()=>{if(confirm('Apagar todos os dados?')){localStorage.removeItem(KEY);location.reload()}};
render();
</script></body></html>
