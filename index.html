<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b45"><title>JucaCards</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#12213a}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#loading .box{max-width:520px;padding:32px;border:1px solid #dce4f0;border-radius:18px;background:#fff;box-shadow:0 20px 50px #10204014}#loading b{font-size:24px}#loading p{color:#66758f;line-height:1.5}</style></head><body><div id="loading"><div class="box"><b>JucaCards</b><p>Carregando sua plataforma completa de estudos…</p></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/carlosferrju-bot/-jucacards/main/';const files=['source/chunk01.txt','source/chunk02.txt','source/chunk03.txt','source/chunk04.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+f);return r.text()}));const html=parts.join('');if(!html.includes('<!DOCTYPE html>')&&!html.includes('<!doctype html>'))throw new Error('Fonte inválida');const css='<style id="jucacards-responsive">@media(max-width:1100px){.flash-wrap{grid-template-columns:200px minmax(0,1fr)}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.sidebar{width:82px;padding:14px 9px}.brand{justify-content:center}.brand>div:last-child,.sidebar-bottom{display:none}.nav button{justify-content:center;font-size:0}.nav button .icon{font-size:18px}.main{margin-left:82px;width:calc(100% - 82px);padding:18px}.two,.three{grid-template-columns:1fr}.cards-grid,.flash-wrap{grid-template-columns:1fr}.flash-wrap>.flash-side:last-child{grid-column:auto}}@media(max-width:600px){.sidebar{position:sticky;top:0;width:100%;height:auto;min-height:0;padding:8px 10px;display:flex;align-items:center;gap:10px;overflow:hidden;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0;flex:0 0 auto}.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}.nav button{flex:0 0 auto;width:auto;min-width:42px;padding:10px}.main{margin:0;width:auto;padding:14px 12px 28px}.topbar{display:block}.stats{grid-template-columns:1fr 1fr;gap:10px}.form-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-box{max-height:96vh}.search{width:100%;box-sizing:border-box}.flashcard,.flash-inner{min-height:58vh}}</style>';document.open();document.write(html.replace(/<\/head>/i,css+'</head>'));document.close()}catch(e){document.getElementById('loading').innerHTML='<div class="box"><b>JucaCards</b><p>Erro ao carregar a plataforma.</p><p style="font-size:13px">'+String(e.message||e)+'</p></div>'}})()</script></body></html>
