<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c18"><title>JucaCards</title>
<style>
:root{--bg:#080c18;--panel:#10172a;--panel2:#121a2e;--line:#202b45;--text:#edf3ff;--muted:#8e9ab5;--primary:#6d5dfc;--blue:#45a3ff;--green:#23c483;--red:#ff5c77;--yellow:#f4b740;--shadow:0 18px 50px #0006}
:root.light{--bg:#f4f7fb;--panel:#fff;--panel2:#f7f9fd;--line:#dce3ef;--text:#172033;--muted:#647089;--shadow:0 12px 35px #1c294018}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{position:fixed;z-index:20;inset:0 auto 0 0;width:245px;padding:20px 14px;background:var(--panel);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;font-size:20px;font-weight:800}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--blue));display:grid;place-items:center;font-weight:900;color:#fff}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:left;display:flex;gap:11px;align-items:center;width:100%}.nav button:hover,.nav button.on{background:#171d33;color:#fff}.nav i{font-style:normal;width:22px;text-align:center}.bottom{position:absolute;left:14px;right:14px;bottom:18px}.main{margin-left:245px;padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.good{background:#123b2d;border-color:#1d7558;color:#fff}.btn.danger{background:#401b25;border-color:#743040;color:#fff}.btn.warn{background:#4a3814;border-color:#80601d;color:#fff}.theme-toggle{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;display:grid;place-items:center;font-size:20px;box-shadow:0 8px 24px #0002}.theme-toggle:hover{transform:translateY(-1px)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;margin-top:6px}.bar{height:8px;background:#202941;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:20px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.row .grow{flex:1;min-width:0}.tag{display:inline-flex;padding:5px 8px;border-radius:8px;background:#1b2440;color:#bfc9ff;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.toolbar .input{flex:1;min-width:200px}.empty{text-align:center;padding:45px;color:var(--muted)}.flash{min-height:270px;display:flex;flex-direction:column;justify-content:space-between}.flash .q{font-size:20px;line-height:1.5}.flash .a{font-size:16px;line-height:1.55;color:var(--muted);white-space:pre-wrap}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted)}textarea.input{min-height:130px;resize:vertical}.notice{padding:12px;border-radius:11px;background:#17213a;color:#cbd5ec}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:16px}.modal.show{display:grid}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.studyq{text-align:center;padding:35px 10px}.studyq h2{font-size:30px;line-height:1.35}.difficulty{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.progressline{display:flex;justify-content:space-between;gap:12px}.hide{display:none!important}.clickable{cursor:pointer}.danger-text{color:var(--red)}
@media(max-width:950px){.side{width:78px}.brand span,.nav button span,.bottom span{display:none}.nav button{justify-content:center}.main{margin-left:78px}.stats,.three,.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:620px){.side{position:sticky;width:100%;height:auto;padding:8px;display:flex;align-items:center;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0}.brand span{display:none}.logo{width:36px;height:36px}.nav{display:flex;overflow:auto;gap:5px;flex:1}.nav button{min-width:43px;width:43px;padding:10px;font-size:0}.nav i{font-size:16px}.bottom{display:none}.main{margin:0;padding:15px}.top{display:flex;align-items:center}.title h1{font-size:23px}.top>.actions{margin-top:0}.stats,.three,.cards,.two{grid-template-columns:1fr}.stat strong{font-size:24px}.studyq h2{font-size:24px}.modalbox{padding:15px}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">JC</div><span>JucaCards</span></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><header class="top"><div class="title"><h1 id="heading">Dashboard</h1><div class="muted" id="sub">Seu centro de estudos</div></div><div class="actions"><button class="btn" onclick="backup()">Exportar</button><button class="btn primary" onclick="openCard()">+ Novo flashcard</button></div></header><section id="page"></section></main></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><input id="import" type="file" accept="application/json" class="hide" onchange="importData(event)">
<script>
'use strict';const KEY='jucacards_rebuild_v2',OLD='jucacards_rebuild_v1';
const defaultData=()=>({cards:[],decks:['Geral'],sessions:[],reviews:[],settings:{name:'Carlos',theme:'dark'}});let D=loadData();let state={page:'dashboard',filter:'',deckFilter:'',studyId:null,studyShow:false};
const nav=[['dashboard','🏠','Dashboard'],['decks','📚','Concursos'],['cards','🗂️','Flashcards'],['study','🎯','Estudar'],['reviews','🔄','Revisões'],['stats','📊','Estatísticas'],['settings','⚙️','Configurações']];const $=id=>document.getElementById(id);
function loadData(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)return normalize(x);let old=JSON.parse(localStorage.getItem(OLD)||'null');return old?normalize(old):defaultData()}catch{return defaultData()}}
function normalize(x){x=x||{};x.cards=Array.isArray(x.cards)?x.cards:[];x.decks=Array.isArray(x.decks)&&x.decks.length?x.decks:['Geral'];x.sessions=Array.isArray(x.sessions)?x.sessions:[];x.reviews=Array.isArray(x.reviews)?x.reviews:[];x.settings=x.settings||{};x.settings.name=x.settings.name||'Carlos';x.settings.theme=x.settings.theme==='light'?'light':'dark';x.cards=x.cards.map(c=>({...c,id:c.id||uid(),deck:c.deck||x.decks[0],q:String(c.q||''),a:String(c.a||''),seen:!!c.seen,reps:Number(c.reps||0),next:c.next||new Date().toISOString(),interval:Number(c.interval||0)}));return x}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}function uid(){return 'c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function pct(a,b){return b?Math.round(a/b*100):0}function due(c){return new Date(c.next||0)<=new Date()}function dueCount(){return D.cards.filter(due).length}function minutesTotal(){return D.sessions.reduce((a,s)=>a+Number(s.min||0),0)}function fmtMin(m){m=Math.max(0,Math.round(m));return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`}function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function navRender(){$('nav').innerHTML=nav.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="view('${x[0]}')"><i>${x[1]}</i><span>${x[2]}</span></button>`).join('')}
function view(p){state.page=p;if(p!=='cards')state.filter='';navRender();let n=nav.find(x=>x[0]===p);$('heading').textContent=n?n[2]:'Configurações';$('sub').textContent=p==='dashboard'?'Seu centro de estudos':p==='study'?'Sessão de estudo':'Gerencie seu estudo';render()}
function render(){let p=$('page');if(state.page==='dashboard')p.innerHTML=dashboard();else if(state.page==='decks')p.innerHTML=decks();else if(state.page==='cards')p.innerHTML=cards();else if(state.page==='study')p.innerHTML=study();else if(state.page==='reviews')p.innerHTML=reviews();else if(state.page==='stats')p.innerHTML=stats();else p.innerHTML=settings()}
function dashboard(){let total=D.cards.length,seen=D.cards.filter(c=>c.seen).length,d=dueCount();return `<div class="grid stats"><div class="card stat"><div class="muted">Flashcards</div><strong>${total}</strong><small class="muted">${seen} estudados</small></div><div class="card stat"><div class="muted">Para revisar</div><strong>${d}</strong><small class="muted">pendentes agora</small></div><div class="card stat"><div class="muted">Concursos</div><strong>${D.decks.length}</strong><small class="muted">coleções</small></div><div class="card stat"><div class="muted">Tempo estudado</div><strong>${fmtMin(minutesTotal())}</strong><small class="muted">tempo registrado</small></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Continue estudando</h3><div class="list"><div class="row"><div class="grow"><b>${d?'Revisões pendentes':'Flashcards'}</b><div class="muted">${d?d+' cartão(ões) aguardando revisão':'Escolha uma coleção para começar'}</div></div><button class="btn primary" onclick="view('${d?'reviews':'study'}')">Começar</button></div><div class="row"><div class="grow"><b>Progresso geral</b><div class="bar" style="margin-top:9px"><span style="width:${pct(seen,total)}%"></span></div></div><b>${pct(seen,total)}%</b></div></div></div><div class="card"><h3>Atalhos</h3><div class="actions"><button class="btn" onclick="openCard()">Novo flashcard</button><button class="btn" onclick="openDeck()">Novo concurso</button><button class="btn" onclick="document.getElementById('import').click()">Importar backup</button></div></div></div><div class="card" style="margin-top:16px"><h3>Concursos</h3><div class="grid three">${D.decks.map(d=>`<div class="row clickable" onclick="openDeckCards('${esc(d)}')"><div><b>${esc(d)}</b><div class="muted">${D.cards.filter(c=>c.deck===d).length} flashcards</div></div><span>›</span></div>`).join('')}</div></div>`}
function decks(){let q=state.deckFilter.toLowerCase();let list=D.decks.filter(d=>d.toLowerCase().includes(q));return `<div class="toolbar"><input class="input" value="${esc(state.deckFilter)}" placeholder="Buscar concurso..." oninput="state.deckFilter=this.value;render()"><button class="btn primary" onclick="openDeck()">+ Concurso</button></div><div class="grid cards">${list.map(d=>{let n=D.cards.filter(c=>c.deck===d).length,s=D.cards.filter(c=>c.deck===d&&c.seen).length;return `<div class="card"><span class="tag">CONCURSO</span><h3>${esc(d)}</h3><p class="muted">${n} flashcards · ${pct(s,n)}% estudados</p><div class="bar"><span style="width:${pct(s,n)}%"></span></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="openDeckCards('${esc(d)}')">Abrir</button><button class="btn" onclick="openDeck('${esc(d)}')">Editar</button>${D.decks.length>1?`<button class="btn danger" onclick="delDeck('${esc(d)}')">Excluir</button>`:''}</div></div>`}).join('')||'<div class="card empty">Nenhum concurso encontrado.</div>'}</div>`}
function openDeckCards(d){state.page='cards';state.filter='';state.deckFilter=d;navRender();$('heading').textContent=d;$('sub').textContent='Flashcards do concurso';render()}
function cards(){let q=state.filter.toLowerCase();let list=D.cards.filter(c=>!q||c.q.toLowerCase().includes(q)||c.a.toLowerCase().includes(q)||c.deck.toLowerCase().includes(q));if(state.deckFilter)list=list.filter(c=>c.deck===state.deckFilter);return `<div class="toolbar"><input class="input" value="${esc(state.filter)}" placeholder="Buscar pergunta, resposta ou concurso..." oninput="state.filter=this.value;render()"><button class="btn" onclick="state.filter='';state.deckFilter='';render()">Limpar</button><button class="btn primary" onclick="openCard()">+ Novo</button></div><div class="muted" style="margin-bottom:12px">${list.length} cartão(ões)</div><div class="grid cards">${list.map(c=>`<article class="card flash"><div><span class="tag">${esc(c.deck)}</span><h3 class="q">${esc(c.q)}</h3><p class="a">${esc(c.a)}</p></div><div><div class="muted" style="margin-bottom:9px">${c.reps||0} revisão(ões) · ${due(c)?'<span class="danger-text">revisão pendente</span>':'próxima: '+date(c.next)}</div><div class="actions"><button class="btn" onclick="openCard('${c.id}')">Editar</button><button class="btn primary" onclick="startCard('${c.id}')">Estudar</button><button class="btn danger" onclick="delCard('${c.id}')">Excluir</button></div></div></article>`).join('')||'<div class="card empty">Nenhum flashcard encontrado.</div>'}</div>`}
function date(v){try{return new Date(v).toLocaleDateString('pt-BR')}catch{return '-'}}function startCard(id){state.studyId=id;state.studyShow=false;view('study')}function nextStudyCard(current){let pool=D.cards.filter(due);if(!pool.length)pool=D.cards.filter(c=>!c.seen);if(!pool.length)pool=D.cards;return pool.find(c=>c.id!==current)||null}
function study(){let c=D.cards.find(x=>x.id===state.studyId);if(!c){c=D.cards.find(due)||D.cards.find(x=>!x.seen)||D.cards[0];if(c)state.studyId=c.id}if(!c)return '<div class="card empty">Crie um flashcard para iniciar o estudo.</div>';let d=dueCount();return `<div class="card"><div class="progressline"><span class="tag">${esc(c.deck)}</span><span class="muted">${d} pendente(s)</span></div><div class="studyq"><div class="muted">Pergunta</div><h2>${esc(c.q)}</h2>${state.studyShow?`<div class="notice"><b>Resposta</b><p style="white-space:pre-wrap;font-size:17px">${esc(c.a)}</p></div>`:'<p class="muted">Tente responder mentalmente antes de revelar.</p>'}</div><div class="difficulty">${!state.studyShow?`<button class="btn primary" onclick="state.studyShow=true;render()">Revelar resposta</button>`:`<button class="btn danger" onclick="rateCard('${c.id}','hard')">Difícil</button><button class="btn warn" onclick="rateCard('${c.id}','good')">Bom</button><button class="btn good" onclick="rateCard('${c.id}','easy')">Fácil</button>`}</div></div>`}
function rateCard(id,r){let c=D.cards.find(x=>x.id===id);if(!c)return;c.seen=true;c.reps=(c.reps||0)+1;let interval=c.interval||0;let days=r==='hard'?1:r==='good'?(interval?Math.max(2,Math.round(interval*1.8)):3):(interval?Math.max(4,Math.round(interval*2.8)):7);c.interval=days;c.next=new Date(Date.now()+days*86400000).toISOString();c.lastRating=r;D.reviews.push({id,r,date:new Date().toISOString()});save();let n=nextStudyCard(id);state.studyId=n?n.id:null;state.studyShow=false;render()}
function reviews(){let dueCards=D.cards.filter(due);return `<div class="card"><div class="progressline"><div><h3 style="margin:0">Revisões de hoje</h3><div class="muted">${dueCards.length} cartão(ões) aguardando revisão.</div></div><button class="btn primary" onclick="view('study')">Começar revisão</button></div><div class="list" style="margin-top:16px">${dueCards.map(c=>`<div class="row"><div class="grow"><b>${esc(c.q)}</b><div class="muted">${esc(c.deck)} · ${c.reps||0} revisão(ões)</div></div><button class="btn" onclick="startCard('${c.id}')">Revisar</button></div>`).join('')||'<div class="empty">Você está em dia. 🎉</div>'}</div></div>`}
function stats(){let total=D.cards.length,seen=D.cards.filter(c=>c.seen).length;return `<div class="grid stats"><div class="card stat"><div class="muted">Progresso</div><strong>${pct(seen,total)}%</strong><div class="bar"><span style="width:${pct(seen,total)}%"></span></div></div><div class="card stat"><div class="muted">Revisões</div><strong>${D.reviews.length}</strong></div><div class="card stat"><div class="muted">Sessões</div><strong>${D.sessions.length}</strong></div><div class="card stat"><div class="muted">Tempo</div><strong>${fmtMin(minutesTotal())}</strong></div></div><div class="card" style="margin-top:16px"><h3>Desempenho por concurso</h3><div class="list">${D.decks.map(d=>{let n=D.cards.filter(c=>c.deck===d).length,s=D.cards.filter(c=>c.deck===d&&c.seen).length,dd=D.cards.filter(c=>c.deck===d&&due(c)).length;return `<div><div class="row"><span><b>${esc(d)}</b><span class="muted"> · ${n} cartões · ${dd} pendentes</span></span><b>${pct(s,n)}%</b></div><div class="bar"><span style="width:${pct(s,n)}%"></span></div></div>`}).join('')}</div></div>`}
function settings(){return `<div class="grid two"><div class="card"><h3>Preferências</h3><div class="form"><label>Nome<input class="input" id="name" value="${esc(D.settings.name)}"></label><button class="btn primary" onclick="saveSettings()">Salvar alterações</button></div></div><div class="card"><h3>Dados</h3><p class="muted">Os dados ficam neste navegador. Use o backup para transferi-los.</p><div class="actions"><button class="btn" onclick="backup()">Exportar backup</button><button class="btn" onclick="document.getElementById('import').click()">Importar backup</button><button class="btn danger" onclick="resetAll()">Apagar dados</button></div></div></div>`}
function saveSettings(){D.settings.name=$('name').value.trim()||'Carlos';save();alert('Configurações salvas.')}function toggleTheme(){D.settings.theme=D.settings.theme==='light'?'dark':'light';save();applyTheme();render()}function applyTheme(){document.documentElement.classList.toggle('light',D.settings.theme==='light');$('themeToggle').textContent=D.settings.theme==='light'?'☀️':'🌙';$('themeToggle').title=D.settings.theme==='light'?'Ativar modo escuro':'Ativar modo claro';document.querySelector('meta[name="theme-color"]').setAttribute('content',D.settings.theme==='light'?'#f4f7fb':'#080c18')}
function openCard(id=''){let c=id?D.cards.find(x=>x.id===id):null,deck=c?.deck||D.decks[0];$('modalbox').innerHTML=`<h2>${c?'Editar':'Novo'} flashcard</h2><div class="form"><label>Pergunta<textarea class="input" id="fq">${esc(c?.q||'')}</textarea></label><label>Resposta<textarea class="input" id="fa">${esc(c?.a||'')}</textarea></label><label>Concurso<select class="input" id="fd">${D.decks.map(d=>`<option value="${esc(d)}" ${d===deck?'selected':''}>${esc(d)}</option>`).join('')}</select></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCard('${id}')">Salvar flashcard</button></div></div>`;$('modal').classList.add('show')}
function saveCard(id){let q=$('fq').value.trim(),a=$('fa').value.trim(),deck=$('fd').value;if(!q||!a)return alert('Preencha pergunta e resposta.');if(id){let c=D.cards.find(x=>x.id===id);Object.assign(c,{q,a,deck})}else D.cards.push({id:uid(),q,a,deck,seen:false,reps:0,next:new Date().toISOString(),interval:0});save();closeModal();render()}function delCard(id){if(confirm('Excluir este flashcard?')){D.cards=D.cards.filter(c=>c.id!==id);save();render()}}
function openDeck(existing=''){let old=existing?D.decks.find(x=>x===existing):'';$('modalbox').innerHTML=`<h2>${old?'Editar':'Novo'} concurso</h2><div class="form"><label>Nome<input class="input" id="dn" value="${esc(old)}" placeholder="Ex.: CFO PMBA"></label><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveDeck('${esc(existing)}')">Salvar</button></div></div>`;$('modal').classList.add('show')}
function saveDeck(old){let n=$('dn').value.trim();if(!n)return alert('Informe o nome do concurso.');if(old){if(n!==old&&D.decks.includes(n))return alert('Já existe um concurso com esse nome.');D.decks=D.decks.map(x=>x===old?n:x);D.cards.forEach(c=>{if(c.deck===old)c.deck=n})}else if(!D.decks.includes(n))D.decks.push(n);save();closeModal();render()}function delDeck(d){if(D.cards.some(c=>c.deck===d))return alert('Este concurso possui flashcards. Exclua ou mova os cartões antes.');if(confirm('Excluir este concurso?')){D.decks=D.decks.filter(x=>x!==d);save();render()}}
function closeModal(){$('modal').classList.remove('show')}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});function backup(){let blob=new Blob([JSON.stringify({...D,exportedAt:new Date().toISOString(),app:'JucaCards'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jucacards-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{D=normalize(JSON.parse(r.result));save();view('dashboard');alert('Backup importado com sucesso.')}catch{alert('Backup inválido.')}e.target.value=''};r.readAsText(f)}function resetAll(){if(confirm('Apagar todos os dados?')){localStorage.removeItem(KEY);localStorage.removeItem(OLD);location.reload()}}
function init(){loadTimer();applyTheme();navRender();render();if(state.timer.running)tickTimer()}init();
</script></body></html>
