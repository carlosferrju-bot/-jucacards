<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c18"><title>JucaCards</title><style>html,body{margin:0;min-height:100%;background:#080c18;color:#edf3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center}#loading .box{padding:28px;border:1px solid #202b45;border-radius:18px;background:#0e1425}</style></head><body><div id="loading"><div class="box">Carregando JucaCards…</div></div><script>
(async()=>{try{
 const base='https://raw.githubusercontent.com/carlosferrju-bot/-jucacards/main/';
 const files=['source/chunk01.txt','source/chunk02.txt','source/chunk03.txt','source/chunk04.txt'];
 const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f+'?v=2',{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+f);return r.text()}));
 const html=parts.join('');
 const parsed=new DOMParser().parseFromString(html,'text/html');
 if(!parsed.body||!parsed.body.children.length)throw new Error('Fonte do JucaCards inválida');
 document.title=parsed.title||'JucaCards';
 document.head.querySelectorAll('link[rel="manifest"],link[rel="icon"],meta[name="apple-mobile-web-app-capable"],meta[name="apple-mobile-web-app-status-bar-style"],meta[name="apple-mobile-web-app-title"]').forEach(e=>e.remove());
 parsed.head.querySelectorAll('style,link[rel="stylesheet"],meta[name="theme-color"]').forEach(e=>document.head.appendChild(document.importNode(e,true)));
 document.body.innerHTML='';
 [...parsed.body.childNodes].forEach(n=>document.body.appendChild(document.importNode(n,true)));
 const responsive=document.createElement('style');responsive.textContent='@media(max-width:1100px){.flash-wrap{grid-template-columns:200px minmax(0,1fr)}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.sidebar{width:82px;padding:14px 9px}.brand{justify-content:center}.brand>div:last-child,.sidebar-bottom{display:none}.nav button{justify-content:center;font-size:0}.nav button .icon{font-size:18px}.main{margin-left:82px;width:calc(100% - 82px);padding:18px}.two,.three,.cards-grid,.flash-wrap{grid-template-columns:1fr}}@media(max-width:600px){.sidebar{position:sticky!important;top:0!important;width:100%!important;height:auto!important;padding:8px 10px!important;display:flex!important;align-items:center;overflow:hidden;border-right:0!important;border-bottom:1px solid var(--line)}.brand{padding:0;flex:0 0 auto}.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}.nav button{flex:0 0 auto;width:auto;min-width:42px;padding:10px}.main{margin:0;width:auto;padding:14px 12px 28px}.topbar{display:block}.stats{grid-template-columns:1fr 1fr;gap:10px}.form-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-box{max-height:96vh}.search{width:100%;box-sizing:border-box}.flashcard,.flash-inner{min-height:58vh}}';document.head.appendChild(responsive);
 [...document.body.querySelectorAll('script')].forEach(old=>{const s=document.createElement('script');for(const a of old.attributes)s.setAttribute(a.name,a.value);if(old.src){s.src=old.src}else{s.textContent=old.textContent}old.replaceWith(s)});
}catch(e){document.body.innerHTML='<div id="loading"><div class="box"><b>JucaCards</b><p>Erro ao inicializar a plataforma.</p><p style="font-size:13px">'+String(e.message||e)+'</p></div></div>';console.error(e)}})();
</script></body></html>
