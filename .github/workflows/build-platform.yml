name: Build JucaCards platform

# O JucaCards usa index.html como carregador da plataforma versionada.
# A publicação não deve sobrescrever esse carregador automaticamente.
# O fluxo fica disponível apenas para execução manual quando necessário.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source chunks
        shell: bash
        run: |
          set -euo pipefail
          test -s source/chunk01.txt
          test -s source/chunk02.txt
          test -s source/chunk03.txt
          test -s source/chunk04.txt
          grep -qi "JucaCards" source/chunk01.txt
          test -s index.html
          grep -qi "source/chunk01.txt" index.html
