name: Restore JucaCards source

# Mantido como ferramenta manual de recuperação. Não executar automaticamente
# em pushes, pois isso sobrescreveria a camada responsiva do index.html.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JucaCards
        shell: bash
        run: |
          set -euo pipefail
          test -s source.gz.b64
          test -s index.html
          grep -qi "JucaCards" index.html
