name: Enable JucaCards sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure sync script is loaded
        shell: bash
        run: |
          set -e
          if ! grep -q 'src="/sync.js"' index.html; then
            python3 - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text(encoding='utf-8')
needle='</body>'
if needle not in s:
    raise SystemExit('index.html: </body> not found')
s=s.replace(needle, '<script src="/sync.js"></script></body>', 1)
p.write_text(s, encoding='utf-8')
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix: load cross-device JucaCards sync'
            git push
          else
            echo 'sync.js already loaded'
          fi
