name: Inject persistence client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure sync script is loaded and large imports sync safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/sync.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)

          marker='/* JUCA_INLINE_SYNC_V2 */'
          if marker not in s:
              inline=r'''<script>/* JUCA_INLINE_SYNC_V2 */
(function(){
  if(window.__JUCA_INLINE_SYNC_V2__)return;
  window.__JUCA_INLINE_SYNC_V2__=true;
  const K='jucacards_data',L=K+'_last_good';
  const parse=x=>{try{return x?JSON.parse(x):null}catch(e){return null}};
  const valid=x=>x&&typeof x==='object'&&!Array.isArray(x)&&(Array.isArray(x.cards)||Array.isArray(x.decks));
  const count=x=>Array.isArray(x?.cards)?x.cards.length:0;
  const content=x=>valid(x)&&(count(x)>0||(Array.isArray(x.reviews)&&x.reviews.length>0)||(Array.isArray(x.decks)&&x.decks.length>1));
  const best=()=>{let b=null,bs=-1;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),d=parse(localStorage.getItem(k));if(!valid(d))continue;const sc=count(d)*100000+(Array.isArray(d.reviews)?d.reviews.length:0)*100+(Array.isArray(d.decks)?d.decks.length:0);if(sc>bs){bs=sc;b=d}}return b};
  async function sync(){
    const local=best();if(!content(local))return;
    try{
      const r=await fetch('/api/data',{cache:'no-store'}),j=await r.json().catch(()=>null),remote=j?.data;
      if(!r.ok||!valid(remote)||count(remote)===0||count(local)>count(remote)){
        const body=JSON.stringify(local);
        const w=await fetch('/api/data',{method:'PUT',headers:{'content-type':'application/json'},body,cache:'no-store'});
        if(w.ok){localStorage.setItem(K,body);localStorage.setItem(L,body)}
      }
    }catch(e){console.warn('JucaCards inline sync:',e)}
  }
  setTimeout(sync,700);setInterval(sync,5000);window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
})();</script>'''
              s=s.replace('</body>',inline+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit injection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load persistent storage client [skip ci]'
          git push
