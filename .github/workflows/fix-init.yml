name: Fix JucaCards initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-init:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure app initializes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</script>'
          if 'init();' not in s:
              s = s.replace(marker, '\ninit();\n' + marker, 1)
          elif 'function init(){applyTheme();navRender();render()}init();' not in s and '\ninit();\n' not in s:
              s = s.replace(marker, '\ninit();\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix app initialization [skip ci]'
          git push
